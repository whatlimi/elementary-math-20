<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 交互设计知识库 · A–G</title>
<style>
  :root{
    --bg:#ffffff; --sidebar:#f7f7f5; --text:#37352f; --muted:#787774;
    --border:#e9e9e7; --border-soft:#f2f2f0; --border-strong:#d4d2cc;
    --accent:#37352f; --accent-bg:#f1f1ef;
    --hover:#f1f1ef; --blue:#0b6bcf; --code-bg:#f7f6f3;
    --serif:ui-serif,Georgia,"Songti SC",serif;
    --sans:ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;font-size:16px}

  .topbar{position:sticky;top:0;z-index:50;height:45px;background:var(--bg);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:8px;padding:0 14px}
  .topbar .menu{font-size:16px;color:var(--muted);background:none;border:none;cursor:pointer;width:30px;height:30px;border-radius:6px}
  .topbar .menu:hover{background:var(--hover)}
  .searchbox{flex:1;max-width:360px;display:flex;align-items:center;gap:6px;background:var(--hover);
    border-radius:6px;padding:4px 10px;font-size:14px}
  .searchbox input{border:none;background:transparent;outline:none;flex:1;font-size:14px;color:var(--text)}
  .crumb{font-size:13px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:auto}
  .crumb .clear{color:var(--blue);cursor:pointer;margin-left:8px;font-size:12px}
  .crumb .clear:hover{text-decoration:underline}
  .searchinfo .mod-hits{margin-bottom:6px;font-size:13px;color:var(--text);line-height:1.9}
  .searchinfo .mod-hits .mh-lb{color:var(--muted);margin-right:4px}
  .searchinfo .mod-jump{display:inline-block;background:#fff;border:1px solid var(--border);border-radius:5px;padding:1px 8px;margin:0 4px 2px 0;
    color:#3b34a8;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .searchinfo .mod-jump:hover{background:rgba(79,70,229,.08);border-color:#c7d2fe}
  .sidebar{position:fixed;top:45px;bottom:0;left:0;width:262px;background:#f7f7f7;
    border-right:1px solid #ededea;overflow-y:auto;overflow-x:hidden;padding:10px 8px 60px;transition:transform .2s ease;z-index:40;scrollbar-width:thin}
  .sidebar::-webkit-scrollbar{width:8px}
  .sidebar::-webkit-scrollbar-thumb{background:#deddd9;border-radius:4px}
  .sidebar::-webkit-scrollbar-track{background:transparent}
  .sidebar.closed{transform:translateX(-100%)}
  /* workspace 标题行（Notion 顶部页名，hover 淡灰） */
  .side-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:#37352f;
    padding:6px 8px;border-radius:8px;margin:0 0 8px;user-select:none;white-space:nowrap}
  .side-title:hover{background:rgba(55,53,47,.045)}
  .side-title .dot{width:20px;height:20px;flex:none;background:#37352f;color:#fff;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700}
  .side-group{margin:0 0 2px}
  .side-group>div{font-size:13px;color:#787774;font-weight:600}
  /* 模块折叠头 = 树父节点（chevron 折叠，hover 整行淡灰） */
  .side-group .side-cat{display:flex;align-items:center;gap:2px;width:100%;text-align:left;margin:0;
    padding:6px 6px;border:none;background:transparent;border-radius:6px;font-family:inherit;font-size:13.5px;font-weight:700;color:#333;user-select:none;cursor:pointer;line-height:1.4;margin-top:2px}
  .side-cat:hover{background:rgba(55,53,47,.05)}
  .side-cat .side-arrow{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:none;
    color:#8a8986;transition:transform .15s ease,color .1s;font-size:0;margin-right:2px}
  .side-cat .side-arrow svg{width:13px;height:13px;color:#8a8986}
  .side-cat:hover .side-arrow{color:#37352f}
  .side-cat:hover .side-arrow svg{color:#37352f}
  .side-cat.collapsed .side-arrow{transform:rotate(-90deg)}
  .side-cat-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-cat-body.collapsed{display:none}
  .side-cat-body{padding-left:18px}
  /* 模式项 = 树子节点（缩进，hover 灰、选中深灰块，Notion 无白底无边框） */
  .side-item{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#57564f;text-decoration:none;
    padding:5px 8px;border-radius:6px;margin:0;line-height:1.45;min-height:28px}
  .side-item .ic{width:15px;height:15px;color:#7a7974;flex:none}
  .side-item:hover{background:rgba(55,53,47,.05)}
  .side-item:hover .ic{color:#57564f}
  .side-item.dim{color:#57564f}
  .side-item.dim .ic{color:#7a7974}
  .side-item.on{background:rgba(79,70,229,.1);color:#3b34a8;font-weight:600}
  .side-item.on .ic{color:#3b34a8}
  .side-item.mod{font-weight:600;font-size:14px;color:#37352f;padding-left:8px;margin-top:6px}
  .side-item.mod .ic{color:#37352f}
  .search-hide{display:none !important}
  .side-item.hide-item{display:none}

  .content{transition:margin-left .2s ease}
  .content.shifted{margin-left:262px}
  .doc{max-width:720px;margin:0 auto;padding:56px 56px 180px}
  .doc-head{font-size:13px;color:#787774;display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .doc-head b{color:#37352f;font-weight:600}
  h1.title{font-size:40px;font-weight:700;line-height:1.15;letter-spacing:-.015em;margin-bottom:10px}
  .lead{color:rgba(55,53,47,.7);font-size:17px;line-height:1.6;margin-bottom:6px}
  .mod-lead{background:rgba(79,70,229,.12);border-left:3px solid #4338ca;padding:11px 16px;margin:12px 0 14px;font-size:14.5px;line-height:1.75;color:#35406e;border-radius:0 8px 8px 0;max-width:none}
  .doc-sep{border:none;margin:24px 0 28px}
  .appendix-sep{border:none;border-top:1px solid rgba(55,53,47,.14);margin:28px 0 22px}
  .searchinfo{background:#f7f7f7;border-radius:6px;padding:12px 16px;font-size:14px;color:var(--muted)}
  .searchinfo b{color:var(--text)}
  .searchinfo .clear{color:#2383e2;cursor:pointer;margin-left:8px}
  .searchinfo .clear:hover{text-decoration:underline}
  .searchbar{position:sticky;top:45px;z-index:20;max-width:720px;margin:0 auto;display:none;padding:8px 8px 0}
  .searchbar.show{display:block}
  .searchbar .searchinfo{margin:0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  mark.hl{background:rgba(233,160,0,.32);color:inherit;border-radius:3px;padding:0 1px}

  h2.sec{font-size:22px;font-weight:700;margin:20px 0 6px;letter-spacing:-.01em;display:flex;gap:12px;align-items:baseline;scroll-margin-top:64px}
  h2.sec .mk{font-size:13px;color:#787774;font-weight:500;margin-left:auto;white-space:nowrap}
  h3.pat{font-size:16px;font-weight:600;margin:0;display:flex;align-items:center;gap:12px;letter-spacing:-.01em}
  .pat-hd{cursor:pointer;user-select:none;border-radius:8px;padding:9px 12px;transition:background .12s;border:1px solid transparent;align-items:flex-start}
  .pat-hd:hover{background:#fff;border-color:var(--border-soft)}
  .pat-hd .pat-arr{margin-left:auto;font-size:18px;color:#6f6e68;transition:transform .15s;flex:none;margin-top:2px;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:rgba(0,0,0,.03)}
  .pat-hd:hover .pat-arr{color:#2f2f2e}
  /* 模块1 模式折叠 = 附录式白卡；展开时头与内容融合为一张卡 */
  .card-fold{background:#fff;border:1px solid #e3e2de;border-radius:10px;overflow:hidden;transition:border-color .15s}
  .card-fold.pat-sec + .card-fold.pat-sec{margin-top:10px}
  .card-fold .pat-hd{background:transparent;border:none;border-radius:0;padding:15px 16px 15px 18px;align-items:flex-start}
  .card-fold .pat-hd-t{font-size:15.5px}
  .card-fold .pat-hd-d{margin-top:1px}
  .card-fold .pat-body{margin:0}
  .card-fold.open .pat-hd{background:#fafaf9;border-bottom:1px solid #f0efec}
  .card-fold.open{background:#fff}
  .card-fold.open .pcard{border:none;border-radius:0;background:transparent;padding:18px 22px 22px;margin:0}
  .pat-sec.open .pat-hd .pat-arr{transform:rotate(180deg)}
  .pat-hd-t{white-space:nowrap;font-weight:650;color:#2f2f2e;padding-top:1px;flex:none}
  .pat-hd-t svg{width:20px;height:20px;flex:none}
  .pat-hd-d{flex:1;font-size:13.5px;color:#8a8a85;font-weight:400;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-top:1px}
  .pat-sec.open .pat-hd-d{color:#6a6a64}
  .pat-hd>svg{width:22px;height:22px;flex:none}
  .pat-body{display:none;margin-top:6px}
  .pat-sec.open .pat-body{display:block}
  .appx{margin:0 0 12px}
  .appx-hd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:8px;padding:12px 16px;font-family:inherit;font-size:17px;font-weight:650;color:#2f2f2e;cursor:pointer;transition:background .12s}
  .appx-hd:hover{background:#fafafa}
  .appx-t{letter-spacing:-.01em}
  .appx-mk{margin-left:6px;font-size:12px;color:#a5a49f;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .appx-hd .pat-arr{margin-left:auto;flex:none}
  .appx-bd{display:none;padding:14px 6px 6px}
  .appx.open .appx-bd{display:block}
  .appx.open .appx-hd .pat-arr{transform:rotate(180deg)}
  .combo-row{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.7;color:rgba(55,53,47,.85);padding:8px 0}
  .combo-k{flex:none;font-weight:600;color:#2f2f2e;min-width:88px}
  .pat-lead{font-size:15px;line-height:1.7;color:#4a4a46;font-weight:400;margin:2px 0 12px;max-width:60ch}
  h3.pat .ic{color:#37352f}
  .pat-sec{margin-top:18px}
  .pat-sec + .pat-sec{padding-top:6px;margin-top:22px}
  p.body{color:var(--text);margin:8px 0;line-height:1.65}
  .field-label{font-size:12px;font-weight:500;color:#787774;margin:16px 0 5px;display:flex;align-items:center;gap:6px;letter-spacing:.015em}
  .field-val{font-size:15px;line-height:1.7;color:rgba(55,53,47,.85)}
  .field-val ul{padding-left:20px}
  .field-val li{margin:3px 0}
  .pill{display:inline-block;background:rgba(55,53,47,.05);border-radius:4px;padding:1px 6px;font-size:12.5px;color:rgba(55,53,47,.7);margin-right:6px}
  .ref-line{font-size:14px;color:var(--muted)}
  .ic{width:1em;height:1em;display:inline-block;vertical-align:-0.13em;flex:none;color:inherit}

  /* 模式详情 · 分区信息卡 */
  .pcard{border:1px solid #f0f0ef;border-radius:12px;background:#FAFAFA;padding:22px 24px;margin:0 0 16px}
  .prow{display:grid;grid-template-columns:1fr 1fr;gap:16px 32px}
  @media(max-width:560px){.prow{grid-template-columns:1fr}}
  .pcell .phead{font-size:11px;font-weight:600;color:#a5a49f;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .pcell .phead::before{content:'';width:6px;height:6px;border-radius:50%;background:#4338ca;opacity:.7;flex:none}
  .pcard>.phead{font-size:11px;font-weight:600;color:#a5a49f;letter-spacing:.08em;text-transform:uppercase;margin:0 0 2px;display:flex;align-items:center;gap:6px}
  .pcard>.phead::before{content:'';width:6px;height:6px;border-radius:50%;background:#4338ca;opacity:.7;flex:none}
  .pcell .pbody{font-size:14.5px;line-height:1.7;color:rgba(55,53,47,.85)}
  .ptips{margin:0;padding:0;list-style:none}
  .pdiv{height:18px;margin:0}
  .ptips li{position:relative;padding:9px 0 9px 30px;font-size:14.5px;line-height:1.65;color:#3d3d39}
  .ptips li:last-child{border-bottom:none}
  .ptips li::before{content:'';position:absolute;left:3px;top:13px;width:14px;height:14px;border-radius:4px;background:#eef1ff;border:1.5px solid #4338ca;box-sizing:border-box}
  .ptips li::after{content:'✓';position:absolute;left:7px;top:11px;font-size:9.5px;color:#4338ca;font-weight:700}
  .ptag{display:inline-flex;align-items:center;background:#f4f6fb;color:#3d4672;border:1px solid #e4e8f4;border-radius:100px;padding:5px 13px;font-size:12.5px;font-weight:500;margin:0 7px 7px 0;transition:.12s}
  .ptag:hover{border-color:#c9d1ea;background:#eef1fb}
  .refb{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#3d3d39;background:#fff;border:1px solid var(--border);border-radius:8px;padding:5px 10px 5px 6px;font-size:12.5px;margin:0 8px 8px 0;transition:.12s;font-weight:500}
  .refb:hover{border-color:var(--rc);box-shadow:0 0 0 1px var(--rc) inset}
  .refb-ic{width:22px;height:22px;border-radius:6px;background:var(--rc);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;font-family:var(--sans)}
  .refb:hover .refb-ic{background:var(--rc)}
  .pchip{display:inline-flex;align-items:center;background:#f5f5f3;color:#55554f;border:1px solid #e7e7e3;border-radius:6px;padding:3px 9px;font-size:12.5px;margin:0 6px 6px 0}
  .pmeta{padding-top:4px}
  .pmeta .mrow{display:flex;gap:14px;font-size:14px;line-height:1.7;padding:7px 0;color:rgba(55,53,47,.85)}
  .pmeta .mrow .mkey{flex:none;font-size:11px;font-weight:600;color:#a5a49f;letter-spacing:.05em;text-transform:uppercase;width:112px;padding-top:2px}
  .pmeta .mrow .mval{flex:1}
  .quote{background:rgba(233,160,0,.13);border-left:3px solid #e8a000;padding:12px 18px;margin:0 0 16px;font-size:14.5px;color:#6b5b2e;line-height:1.7;border-radius:0 8px 8px 0}
  .quote b{color:#a05f00}

  .outline{border-top:1px solid rgba(55,53,47,.07);border-bottom:1px solid rgba(55,53,47,.07);padding:14px 2px;margin:26px 0}
  .outline .ot{font-size:12px;color:#787774;font-weight:500;margin-bottom:6px}
  .outline a{display:block;color:#37352f;text-decoration:none;font-size:14.5px;padding:3px 0}
  .outline a:hover{color:#37352f;text-decoration:underline}
  .outline a.sub{padding-left:20px;font-size:13.5px;color:#787774}

  table{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0}
  th{font-size:12.5px;color:#787774;font-weight:600;text-align:left;border-bottom:1px solid rgba(55,53,47,.3);padding:6px 8px}
  td{border-bottom:1px solid rgba(55,53,47,.08);padding:7px 8px;vertical-align:top}
  td.dots{font-family:var(--mono);font-size:12px;white-space:nowrap;color:#787774}

  .check{border-top:1px solid var(--border);padding:7px 0;font-size:15px;align-items:flex-start;line-height:1.6;color:rgba(55,53,47,.85)}
  .toplink{display:inline-block;margin-top:20px;color:var(--blue);font-size:14px;text-decoration:none}

  /* demo 区 */
  .demo-area{border:1px solid #dfddd7;border-radius:12px;margin:0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .pcard .demo-area{border:1px solid var(--border-soft);border-radius:10px;margin-top:2px}
  .demo-head{background:#fff;padding:9px 16px;font-size:12.5px;color:#8a8a86;border-bottom:1px solid var(--border);font-family:var(--mono);letter-spacing:.04em}
  .demo-stage{position:relative;background:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-color:#f7f6f2;background-size:20px 20px;padding:26px 28px;min-height:190px;overflow:hidden}
  .demo-note{background:#fff;padding:7px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
  /* B 模块 · 端到端对话工作台 */
  .bd-ws{display:flex;flex-direction:column;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);font-size:13px}
  .bd-top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:#fbfbfa}
  .bd-ico{width:20px;height:20px;border-radius:6px;background:#111;color:#fff;display:grid;place-items:center;font-size:11px;flex:none}
  .bd-top b{font-weight:600;color:#37352f}
  .bd-top .sub{margin-left:auto;font-size:11px;color:#8a8a86;font-family:var(--mono)}
  .bd-chat{max-height:210px;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
  .bd-msg{display:flex;gap:8px;align-items:flex-start;max-width:100%}
  .bd-msg .av{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:11px}
  .bd-msg.ai .av{background:linear-gradient(135deg,#5C57FF,#3A34FF);color:#fff}
  .bd-msg.me{flex-direction:row-reverse}
  .bd-msg.me .av{background:#e3e2df;color:#555}
  .bd-msg .txt{max-width:80%;padding:7px 11px;border-radius:10px;line-height:1.6;color:#333;white-space:pre-wrap;word-break:break-word}
  .bd-msg.ai .txt{background:#f0efec;border-top-left-radius:3px}
  .bd-msg.me .txt{background:#3A34FF;color:#fff;border-top-right-radius:3px}
  .bd-msg .txt .src{display:block;margin-top:6px;font-size:10px;color:#8a8a86;font-family:var(--mono);border-top:1px dashed rgba(0,0,0,.12);padding-top:5px}
  .bd-composer{border-top:1px solid var(--border);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;background:#fff}
  .bd-box{border:1.5px solid var(--border);border-radius:9px;display:flex;align-items:center;gap:4px;padding:2px;background:#fff;transition:border-color .15s}
  .bd-box:focus-within{border-color:#3A34FF}
  .bd-ta{border:none;outline:none;resize:none;flex:1;font-family:inherit;font-size:13px;padding:7px 8px;min-height:34px;line-height:1.5;background:transparent;color:#333}
  .bd-tools{display:flex;align-items:center;gap:5px}
  .bd-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;display:grid;place-items:center;color:#666;transition:.12s;font-family:inherit;flex:none}
  .bd-btn:hover,.bd-btn.on{border-color:#3A34FF;color:#3A34FF;background:#f2f1ff}
  .bd-send{margin-left:auto;border:none;background:#3A34FF;color:#fff;border-radius:8px;padding:6px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:500;flex:none}
  .bd-send:disabled{background:#e0dfdc;color:#9a9a94;cursor:not-allowed}
  .bd-send.stop{background:#111}
  .bd-voice{display:none;align-items:center;gap:10px;padding:8px 12px;border:1.5px solid #3A34FF;border-radius:9px;background:#f7f6ff;font-size:13px;color:#3A34FF}
  .bd-voice.show{display:flex}
  .bd-wave{display:flex;align-items:center;gap:3px;height:18px}
  .bd-wave i{width:3px;height:100%;background:#3A34FF;border-radius:2px;animation:bdwave .9s ease-in-out infinite}
  .bd-wave i:nth-child(2){animation-delay:.12s}.bd-wave i:nth-child(3){animation-delay:.24s}
  .bd-wave i:nth-child(4){animation-delay:.36s}.bd-wave i:nth-child(5){animation-delay:.48s}
  @keyframes bdwave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  .bd-done{margin-left:auto;border:1px solid var(--border);background:#fff;color:#333;border-radius:7px;padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .bd-menu{position:absolute;z-index:30;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.1);padding:5px;display:none;min-width:190px}
  .bd-menu.show{display:block}
  .bd-menu .grp{font-size:10px;color:#8a8a86;padding:4px 8px 2px;font-family:var(--mono);letter-spacing:.05em}
  .bd-menu .it{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px}
  .bd-menu .it:hover{background:#f2f1ff;color:#3A34FF}
  .bd-menu .it small{margin-left:auto;color:#999;font-family:var(--mono)}
  .bd-suggest{display:flex;flex-wrap:wrap;gap:6px}

{ id:"1", title:"1 · 入口设计", lead:"入口设计决定用户在什么时刻、从哪里唤起 AI，以及系统会带入哪些任务上下文。好的入口不只要容易找到，更要贴近当前任务，并让用户清楚知道点击后会发生什么。",

  patterns:[{e:"🧭",n:"导航栏按钮",c:"常驻入口",d:"把 AI 放在产品最稳定的位置，作为用户反复进入的一级功能入口。",u:"AI 是产品核心卖点、需要高曝光，或要在用户心智里确立「这是个 AI 产品」时。",h:["文字标签 + 图标，别只放图标（可发现性）","有选中/激活态，与面板开合联动","位置稳定、跨页面一致"],t:"导航位稀缺，放上去就要为它的点击率负责；AI 不够高频成熟时，占一级入口反而喧宾夺主。",r:["Gmail Gemini","Slack","Linear"],diff:"可发现性最高、位置最稳定，但与正在处理的具体内容距离较远，占用稀缺的一级导航空间。",avoid:"AI 仍是低频试验能力，或无法跨页面保持稳定体验时，不要过早占据一级导航资源。",states:["默认","悬停/聚焦","当前页","面板展开","新结果","不可用"],metrics:["导航点击率","任务发起率","重复访问率"],rel:"主任务入口 · 导航项 · 状态徽标 · 侧边面板",trigger:"始终位于稳定导航位置；进入后保留当前页面作为可选上下文。激活状态与页面/侧栏/面板开合同步。",platform:"桌面用顶栏或侧栏；移动端进主导航或底部一级入口，避免藏在多层汉堡菜单。",a11y:"用真实导航链接/按钮并标识当前状态；图标旁保留文字。名称表达价值，如「生成周报」而非「智能」。"},

   {e:"🛠️",n:"工具栏图标",c:"常驻入口",d:"把 AI 作为编辑能力的一部分，无需离开当前工作区即可改写、总结或生成。",u:"文档、表格、设计稿等编辑场景内，对当前正在写的内容做即时处理。",h:["紧贴编辑区，图标语义清晰（✦/魔法棒等约定）","与其他工具风格统一、不突兀","通常配合「选中内容」使用"],t:"工具条空间有限，图标多则拥挤；AI 项要有足够辨识度，否则淹没在一排格式按钮里。",r:["WPS AI","Figma","Canva"],diff:"比导航入口更贴近当前任务，比划词覆盖更广；上下文通常只精确到当前文档或编辑器。",avoid:"非编辑/操作场景、AI 不依赖当前内容，或工具栏已高度拥挤时应避免。",states:["默认","悬停/聚焦","已有选区","禁用","菜单展开","执行中"],metrics:["工具栏使用率","任务完成率","执行后撤销率"],rel:"快捷任务 · 图标按钮 · 工具提示 · 动作菜单",trigger:"编辑器获焦或存在可处理内容时可用；依赖选区时，未选中应禁用并解释原因。打开后携带当前文档或编辑对象。",platform:"桌面进固定工具栏；移动端收进选中文本后操作条或「更多」菜单，保留足够触控面积。",a11y:"图标按钮必须有可访问名称与工具提示；禁用不只降透明度。文案直接写结果，如「改写」「生成摘要」。"},
   {e:"✍️",n:"划词唤起",c:"上下文入口",d:"选中一段内容后出现 AI 操作条，系统可直接把选区作为任务上下文。",u:"针对「选中的具体内容」做即时操作，且操作类型相对固定、可枚举。",h:["浮条紧贴选区上方，不遮住选中内容","只放最高频动作，避免长菜单","跟随选区变化、选区消失即收起","AI 项与普通格式操作做视觉区分"],t:"选区丢失要立刻收起，否则浮条悬空；动作堆多会让浮条变长，失去「轻」的优势。",r:["Notion","Craft","沉浸式翻译"],diff:"上下文精度高于工具栏和导航，默认不占空间；缺点是要先完成「选中内容」这个动作。",avoid:"对象非文字、移动端占比高，或选中内容涉及敏感信息且读取范围无法说明时应避免。",states:["无选区","有效选区","浮条出现","执行中","结果返回","选区丢失"],metrics:["选区触发率","任务完成率","浮条关闭率"],rel:"上下文推荐 · 选区浮条 · 快捷任务 · 命令菜单",trigger:"仅在有效选区时出现，明确只读取所选内容；选区变化或失焦及时收起，执行期间保存原选区引用。",platform:"桌面靠近选区上方显示；移动端依赖系统选区菜单或底部操作条，避免浮层被虚拟键盘遮挡。",a11y:"不只依赖鼠标划选；支持键盘选文后触发。浮条不抢焦点，关闭后焦点回原文。动作写「改写选中内容」等明确文案。"},
   {e:"🖱️",n:"右键菜单",c:"上下文入口",d:"把 AI 动作放进对象原有的操作路径，适合低频、进阶且依赖具体对象的任务。",u:"进阶用户；需按选中对象类型提供不同的上下文动作时。",h:["AI 项单独分组、带图标，与系统项区隔","遵循系统右键排序与习惯","菜单项随选中对象动态变化"],t:"发现性很低——多数用户不主动右键，必须配合显性入口；移动端无右键，需另设触发。",r:["VS Code","Cursor","Figma"],diff:"几乎不占界面空间，比常驻入口克制；但发现性最低，不能直接照搬到移动端。",avoid:"用户以新手或移动端为主，且无其他显性入口兜底时，不能只依赖右键菜单。",states:["无目标","菜单展开","项目聚焦","当前不可用","执行中","已完成"],metrics:["右键触达率","AI 菜单使用率","无操作关闭率"],rel:"对象操作 · 上下文菜单 · 菜单项 · 分组线",trigger:"用户在明确对象上打开上下文菜单时出现；菜单项随对象类型变化，执行前保留对象引用与选中状态。",platform:"适合桌面鼠标与触控板；移动端提供长按菜单、更多按钮或显性入口，不直接照搬右键。",a11y:"支持 Shift+F10 或菜单键；上下箭头移动、Enter 执行、Esc 返回原对象。AI 动作独立分组并写清作用对象。"},
   {e:"📍",n:"就近触发",c:"上下文入口",d:"就近入口贴在段落、单元格或卡片旁，让用户直接对当前对象执行 AI 操作。",u:"段落级 / 单元格级 / 卡片级的局部、精细操作。",h:["默认隐藏，hover 到对象才出现","紧贴操作对象、指向明确","克制使用，别给每个元素都挂图标"],t:"图标过多显「吵」；hover 出现对触屏不友好，移动端需另设触发（如长按）。",r:["Notion","Coda","飞书多维表格"],diff:"比工具栏更精确，比划词少一步选择；但对象过多时易产生大量图标与视觉噪音。",avoid:"对象密度很高、每个对象都出图标，或完全依赖触屏且无长按替代时应避免。",states:["隐藏","悬停/聚焦","建议出现","菜单展开","执行中","已忽略"],metrics:["入口曝光率","建议采纳率","重复忽略率"],rel:"上下文推荐 · 行内按钮 · 工具提示 · 弹出菜单",trigger:"悬停、聚焦或选中单个内容对象时出现；入口携带当前对象标识，不默认扩大读取范围。",platform:"桌面对象边缘渐显；移动端改为对象更多按钮、滑动动作或长按菜单，不依赖 hover。",a11y:"对象获键盘焦点时同样显示入口；图标有名称与工具提示，不造成布局跳动。文案写「总结这一段」而非「AI 处理」。"},
   {e:"⌨️",n:"命令面板",c:"效率入口",d:"快捷键或命令面板让熟练用户不离开键盘就能搜索功能、输入指令并启动 AI 任务。",u:"高频、追求效率的重度用户；功能繁多、不宜全部平铺在界面上的产品。",h:["全局绑定 ⌘K，并显式提示快捷键","支持模糊搜索 + 最近使用 + AI 指令","上下文感知：按当前位置给不同候选","再按一次或 Esc 关闭并归还焦点"],t:"注意与系统/浏览器快捷键冲突（⌘K 在浏览器是地址栏）；纯键盘入口对新手发现性低。",r:["Linear","Superhuman","Raycast","VS Code"],diff:"操作效率最高、承载能力最强，但天然不适合承担首次发现，必须配合看得见的入口。",avoid:"用户不熟悉键盘工作流、命令数很少，或快捷键与系统/浏览器冲突时不必增加学习成本。",states:["关闭","输入聚焦","搜索中","有结果","无结果","正在执行"],metrics:["命令面板使用率","无结果率","键盘完成率"],rel:"快捷任务 · 任务模板 · 搜索框 · 命令列表 · 快捷键提示",trigger:"可见按钮或快捷键打开，默认聚焦搜索框；候选结合当前位置排序，不隐藏全局命令。执行携带当前页面与选择对象。",platform:"桌面适合键盘优先的居中面板；移动端改全屏搜索或底部命令页，不要求记物理键盘快捷键。",a11y:"用对话框与组合框语义；支持上下箭头、Enter、Esc，关闭后焦点归位。持续展示快捷键提示并提供可见入口。"},
   {e:"🪧",n:"空状态引导",c:"新手入口",d:"空状态入口在用户第一次进入时说明 AI 能做什么，并用可点击示例帮助完成第一个真实任务。",u:"首次进入、空会话，用户不清楚 AI 能力边界、需降低上手门槛时。",h:["一句话说清能力与边界，别堆功能","给 3 条左右可点击示例，降低「不知问什么」","可一键跳过，不强迫","引导过后不再反复强弹"],t:"反复打扰变噪音；示例要贴合真实场景，否则点了不实用反降信任。",r:["ChatGPT","Claude","Notion"],diff:"不是日常任务入口，而是一次性教学入口；完成首次任务或主动跳过后应退出主流程。",avoid:"用户已熟悉产品、示例与角色无关，或教学内容完成后仍长期占据主界面时应避免。",states:["首次进入","示例可选","准备数据","任务进行中","首次成功","已跳过"],metrics:["首次任务发起率","首次任务成功率","新手流程退出率"],rel:"新手与空状态 · 推荐问题 · 引导卡 · 示例按钮",trigger:"仅首次进入、无历史或缺少必要数据时出现；示例点击进入低风险、反馈快的真实任务，完成或跳过后记录状态。",platform:"桌面与移动端均保持首屏可读；移动端减少长说明，优先一条主任务和两三条示例，避免全屏强遮挡。",a11y:"用标准标题、按钮与对话框语义，焦点进出路径完整。说明能力边界，示例用真实业务语言，提供永久跳过。"}],
  appendix:{matrix:{cols:["可发现性","上下文精度","低干扰","新手友好","移动适配"],rows:[["导航栏按钮",5,1,3,5,5],["悬浮球",5,2,2,4,2],["工具栏图标",3,4,4,3,3],["划词唤起",3,5,5,3,2],["右键菜单",2,5,5,2,1],["命令面板",2,3,5,1,2],["就近触发",3,5,4,3,3],["空状态引导",5,2,3,5,5]]},combos:[["AI Chat","导航入口 → 空状态引导 → 命令面板"],["Copilot","导航兜底 → 工具栏 → 划词 / 就近触发"],["Agent","主入口 → 任务快捷项 → 悬浮状态提醒"]],pitfalls:["同一页面多个功能重复的 AI 入口","只放魔法图标，没有文字/提示/业务动作名","打开 AI 丢失选区与页面上下文","依赖悬停/右键，无移动端与键盘替代","首次引导、红点和动画反复无法永久关闭"],checks:["页面有一个明确的主入口，其他入口承担不同角色","入口使用业务动作名称，不只依赖魔法图标","用户知道 AI 会读取当前页面、选区还是整个项目","入口打开后不丢失选区、附件和任务上下文","默认/聚焦/执行中/不可用/新结果状态均已定义","悬停、右键和快捷键都有移动端或可见入口兜底","所有入口都能通过键盘聚焦、触发和关闭","首次引导可跳过，完成后不反复强制出现","已定义入口点击、任务发起、误触和关闭指标","AI 不可用、权限不足和网络失败时仍有明确说明"]}
},
/* —— B 输入设计 —— */
{ id:"2", title:"2 · 输入设计", lead:"输入设计决定用户如何表达意图、补充上下文，以及系统如何回应发送与生成状态。好的输入不仅要降低表达门槛，还要让用户清楚自己提交了什么。",
  groups:[["输入框本体","自适应输入框","占位与引导文案","发送与停止态"],["引导式输入","推荐问题","Prompt 模板","快捷指令"],["输入增强","附件与多模态","语音输入"],["多模态上下文","上下文挂载"]],
  patterns:[
   {e:"📐",n:"自适应输入框",c:"输入框本体",d:"输入框随内容自动长高，到上限再内部滚动。既不挤占空白版面，又能容纳长 Prompt。",
    u:"几乎所有对话式 AI 的主输入框。",
    h:["空时单行，随换行自动增高","到最大高度后内部滚动，不无限撑开","回车发送 / Shift+回车换行，行为可预期","移动端注意键盘遮挡"],
    t:"自动增高若不设上限会把上方消息区挤没；必须配最大高度 + 内部滚动。",
    r:["ChatGPT","Claude","文心一言"]},
   {e:"💬",n:"占位与引导文案",c:"输入框本体",d:"空输入框里的一句话直接决定用户敢不敢开口。给「可照着改的具体例子」而非「请输入…」。",
    u:"输入框空状态、首次使用、切换工作场景时。",
    h:["给具体示例而非「请输入问题」","贴合当前场景（文档里 vs 数据表里）","简短，一眼读完","别把说明书塞进占位文案"],
    t:"占位文案开始输入就消失，不能承载关键信息；塞太长没人读。",
    r:["ChatGPT","Notion AI","Perplexity"]},
   {e:"📤",n:"发送与停止态",c:"输入框本体",d:"发送按钮清楚表达三种状态：不可发 / 可发 / 生成中可停止。「能否立刻停」是 AI 输入的关键体验。",
    u:"所有会「流式生成」的 AI 对话。",
    h:["空内容禁用、有内容高亮","生成中变为「停止」，可中断","发送后清空或保留以便重试","给键盘快捷键（⌘↵）"],
    t:"生成中若不能停止，长回答只能干等，非常挫败。",
    r:["ChatGPT","Claude","Gemini"]},
   {e:"💡",n:"推荐问题",c:"引导式输入",d:"在空状态给几条可点击推荐问题，一键填入，解决冷启动「不知道问什么」。",
    u:"空会话、首屏，以及每轮回答后的「继续追问」。",
    h:["首屏推荐与追问推荐内容不同","点击可直接填入或发送","数量克制（3 条左右）","结合当前上下文动态生成"],
    t:"推荐不贴合真实意图会沦摆设甚至干扰。",
    r:["ChatGPT","Perplexity","豆包"]},
   {e:"🧩",n:"Prompt 模板",c:"引导式输入",d:"把高频任务做成可填空模板，替换【】里的变量即可。降低 Prompt 门槛、保证输出稳定。",
    u:"任务相对固定、可标准化的场景（改写、翻译、生成大纲）。",
    h:["用【】清晰标记可填空位","按场景分组的模板库","可保存复用自定义模板","填空后给出可继续编辑的完整 Prompt"],
    t:"模板太死会限制表达；要允许用户自由修改。",
    r:["扣子 Coze","Notion AI","FlowGPT"]},
   {e:"⚡",n:"快捷指令 /",c:"引导式输入",d:"在输入框打 / 唤起命令菜单，把高频动作变成可搜索指令，省去打描述。",
    u:"高频、可枚举的固定动作。",
    h:["/ 唤起、支持继续输入搜索","命令分组 + 图标，易扫读","选中后可附带参数","与普通输入无缝切换"],
    t:"指令藏在 / 里发现性低，需在界面引导用户知道这个用法。",
    r:["Notion","飞书","Linear"]},
   {e:"📎",n:"附件与多模态",c:"输入增强",d:"让用户上传文件、图片、表格作为提问对象，把 AI 从「只懂文字」扩展到「能看材料」。",
    u:"需要 AI 基于用户具体材料作答（看截图、读文档、分析表格）。",
    h:["支持拖拽 / 粘贴 / 点击上传","上传中、成功、失败都有状态","图片缩略图、文件类型图标","可单独删除某个附件"],
    t:"大文件要管好上传反馈与体积限制，避免「无声失败」。",
    r:["ChatGPT","Claude","通义千问"]},
   {e:"🎤",n:"语音输入",c:"输入增强",d:"按住或点击说话实时转写。波形 + 实时转写让用户确认「它听对了」。",
    u:"移动端、不方便打字或口述更快的场景。",
    h:["录音时给波形 / 音量反馈","实时转写，边说边出字","可暂停 / 取消 / 重录","开始与结束态明确"],
    t:"嘈杂环境识别差，必须给「转写不准可直接编辑」的退路。",
    r:["通义听悟","ChatGPT 语音","飞书妙记"]},
   {e:"📌",n:"上下文挂载",c:"多模态上下文",d:"把「AI 正在参考什么」做成可见、可移除的上下文标签。让用户清楚 AI 看到了哪些材料。",
    u:"AI 答案依赖特定资料，且用户需要掌控参考范围时。",
    h:["用标签显式展示已挂载上下文","每个上下文可单独移除","区分「自动带入」与「手动添加」","也让用户知道 AI 看不到什么"],
    t:"上下文不可见会不信任也无法纠偏；标签太多同样喧宾夺主。",
    r:["Cursor","Notion AI","飞书"]}
  ],
  appendix:{matrix:{cols:["表达门槛低","任务确定","自带上下文","移动适配","实现成本低"],rows:[["直接打字",5,2,1,5,5],["推荐问题",5,3,2,4,5],["Prompt 模板",3,5,1,3,3],["快捷指令 /",3,5,2,4,5],["附件上传",2,4,5,4,3],["语音输入",5,3,1,5,2],["上下文挂载",3,3,5,3,3]]},combos:[["通用助手","直接打字 + 推荐问题 + 附件上传"],["效率工具","快捷指令 / + 自适应输入框 + 上下文挂载"],["移动优先","语音输入 + 推荐问题 + 快捷指令"]],pitfalls:["占位文案塞成说明书，用户一眼看不完","发送后立即清空输入不留重试，误发只能重打","只有打字一种入口，冷启动用户不知能问什么","快捷指令只靠 / 隐藏入口，没有界面引导用户发现","上传附件无进度/失败无声，用户以为没传上","语音转写错误无编辑退路，用户只能整句重说"],checks:["主输入框支持自适应增高与回车/换行双行为","空状态占位给可照着改的具体示例","发送按钮清楚表达 空禁/可发/生成中可停止 三态","空会话与追问阶段各配 3 条左右可点推荐","高频任务有可填空 Prompt 模板或快捷指令","附件/多模态上传有进行、成功、失败三种状态","语音输入有波形反馈、实时转写与可编辑退路","AI 参考的上下文可见且可移除，用户能掌控范围","输入类功能都有键盘可达与移动端等价操作","已定义输入完成、发送、取消与纠错指标"]}

/* B 模块 · 端到端对话工作台（各模式共用骨架，focus 参数激活不同输入方式） */
function bdMount(st,id,cfg){
  const doc_ctx=cfg&&cfg.ctx||'《报销需求.docx》';
  const hello=cfg&&cfg.hello||'我能基于这篇《'+doc_ctx.replace(/[《》]/g,'')+'》帮你总结、改写、答疑。试着问我，或使用下方的输入方式体验。';
  st.innerHTML=`<div class="bd-ws" id="bd${id}">
    <div class="bd-top"><span class="bd-ico">✦</span><b>AI 助手</b><span class="bd-top-sub sub"></span></div>
    <div class="bd-chat" id="bdch${id}">
      <div class="bd-msg ai"><div class="av">✦</div><div class="txt">${hello}</div></div>
    </div>
    <div class="bd-ctx" id="bdctx${id}"></div>
    <div class="bd-composer">
      <div class="bd-suggest" id="bdsug${id}"></div>
      <div class="bd-box">
        <textarea class="bd-ta" id="bdta${id}" placeholder="输入消息，或按 / 唤起指令…" rows="1"></textarea>
        <div class="bd-tools"></div>
      </div>
      <div class="bd-voice" id="bdv${id}"><span class="bd-wave"><i></i><i></i><i></i><i></i><i></i></span>
        <span id="bdvt${id}" style="flex:1">正在聆听…</span>
        <button class="bd-done" id="bdvd${id}">完成</button></div>
    </div></div>`;
  const chat=st.querySelector('#bdch'+id);
  const ta=st.querySelector('#bdta'+id);
  const tools=st.querySelector('.bd-tools');
  function addMsg(role,html){
    const d=document.createElement('div');d.className='bd-msg '+role;
    d.innerHTML=(role==='ai'?'<div class="av">✦</div>':'<div class="av">我</div>')+'<div class="txt">'+html+'</div>';
    chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
  }
  /* AI 打字回复；onDone 在打字完成时调用 */
  function aiReply(md,onDone){
    const el=addMsg('ai',md&&md.src?'':'');
    const txt=el.querySelector('.txt');let i=0;
    const full=md.text;
    txt.textContent='';const tl=document.createElement('span');txt.appendChild(tl);
    const iv=setInterval(()=>{i++;tl.textContent=full.slice(0,i);
      if(i>=full.length){clearInterval(iv);if(md.src){const s=document.createElement('span');s.className='src';s.textContent=md.src;txt.appendChild(s);}chat.scrollTop=chat.scrollHeight;onDone&&onDone();}},12);
    return {el,txt,iv};
  }
  function setSub(t){st.querySelector('#bd'+id+' .bd-top-sub').textContent=t||'';}
  /* 通用工具按钮注册器 */
  function toolBtn(key,label,html){
    const b=document.createElement('button');b.type='button';b.className='bd-btn';b.dataset.k=key;b.title=label;
    b.innerHTML=html;tools.appendChild(b);return b;
  }
  function chip(row,text,fn){const c=document.createElement('span');c.className='bd-chip';c.textContent=text;c.onclick=fn;row.appendChild(c);return c;}
  function ctxAdd(text,icon){const row=st.querySelector('#bdctx'+id);const p=document.createElement('span');p.className='bd-pill';
    p.innerHTML=(icon?`<span class="ic">${icon}</span>`:'')+`<span>${text}</span><span class="x">✕</span>`;
    p.querySelector('.x').onclick=()=>p.remove();row.appendChild(p);return p;}
  return {chat,ta,tools,addMsg,aiReply,setSub,toolBtn,chip,ctxAdd,hello,doc_ctx,docId:id,uid:'bd'+id};
}



/* 侧栏目录：按模块分组列出所有模式（单一事实来源 = m.patterns，避免漏项），模块标题可点击展开/收起 */
function buildTree(){
  const tree=document.getElementById("sideTree");
  let th='';
  LIBRARY.forEach(m=>{
    const first=m===LIBRARY[0];
    const order=m.groups.map(g=>g[0]);
    const byCat={};
    m.patterns.forEach(p=>{ (byCat[p.c]=byCat[p.c]||[]).push(p); });
    th+=`<div class="side-group"><button class="side-cat${first?'':' collapsed'}" type="button" data-cat="${m.id}" aria-expanded="${first}"><span class="side-arrow">${ic("chevron")}</span><span class="side-cat-txt">${m.title.replace(/\s*·\s*/g,' ')}</span></button>`;
    th+=`<div class="side-cat-body${first?'':' collapsed'}" data-body="${m.id}">`;
    order.forEach(cat=>{
      (byCat[cat]||[]).forEach(p=>{ th+=`<a class="side-item dim" href="#${m.id}-${safename(p.n)}" data-mod="${m.id}" data-pname="${esc(p.n)}">${ic(p.n)} ${p.n}</a>`; });
    });
    th+=`</div></div>`;
  });
  tree.innerHTML=th;
  /* 点击模块标题：展开/收起该模块的模式列表（chevron 旋转） */
  tree.querySelectorAll("[data-cat]").forEach(cat=>{
    cat.addEventListener("click",()=>{
      const body=tree.querySelector(`[data-body="${cat.dataset.cat}"]`);
      const isCollapsed=body.classList.toggle("collapsed");
      cat.classList.toggle("collapsed",isCollapsed);
      cat.setAttribute("aria-expanded",!isCollapsed);
    });
  });
}
function safename(n){return n.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]+/g,'');}

/* 渲染单个模式的完整详情 */
function patternHtml(m,p){
  const id=m.id+'-'+safename(p.n);
  const refs=(p.r||[]).map(r=>refTag(r)).join("");
  // 搜索索引：含全部可检索文本
  const allTxt=[m.title,p.n,p.c,p.d,p.u,p.t,(p.r||[]).join(' '),(p.h||[]).join(' '),p.diff,p.avoid,(p.states||[]).join(' '),(p.metrics||[]).join(' '),p.rel,p.trigger,p.platform,p.a11y].filter(Boolean).join(' ').toLowerCase();
  let card='';
  // 上部二栏：适用场景 / 关键取舍
  const upper=[];
  if(p.u) upper.push(`<div class="pcell"><div class="phead">适用场景</div><div class="pbody">${esc(p.u)}</div></div>`);
  if(p.t) upper.push(`<div class="pcell"><div class="phead">关键取舍</div><div class="pbody">${esc(p.t)}</div></div>`);
  if(upper.length) card+=`<div class="prow">${upper.join('')}</div>`;
  // 设计要点
  if(p.h&&p.h.length){ card+=`<div class="pdiv"></div><div class="phead">设计要点</div><ol class="ptips">${(p.h||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`; }
  // 参考产品
  if(refs){ card+=`<div class="pdiv"></div><div class="phead">参考产品</div><div>${refs||"—"}</div>`; }
  // 其余扩展字段 → 统一 meta 行
  const meta=[];
  if(p.diff) meta.push(['与其他方案差别',esc(p.diff)]);
  if(p.states&&p.states.length) meta.push(['关键状态',p.states.map(x=>`<span class="pchip">${esc(x)}</span>`).join("")]);
  if(p.metrics&&p.metrics.length) meta.push(['关注指标',p.metrics.map(x=>`<span class="pchip">${esc(x)}</span>`).join("")]);
  if(p.rel) meta.push(['关联模式',esc(p.rel)]);
  if(p.trigger) meta.push(['触发与上下文',esc(p.trigger)]);
  if(p.platform) meta.push(['桌面 / 移动策略',esc(p.platform)]);
  if(p.a11y) meta.push(['无障碍与文案',esc(p.a11y)]);
  if(meta.length){ card+=`<div class="pdiv"></div><div class="pmeta">${meta.map(x=>`<div class="mrow"><div class="mkey">${x[0]}</div><div class="mval">${x[1]}</div></div>`).join("")}</div>`; }
  // 避免使用（卡内警示区，quote 自带标签）
  if(p.avoid) card+=`<div class="pdiv"></div><div class="quote"><b>避免使用：</b>${esc(p.avoid)}</div>`;
  // 交互案例（卡内演示区，demo-head 自带标题）
  card+=`<div class="pdiv"></div>${demoHtml(m,p,id)}`;
  let h=`<div class="pat-sec card-fold" id="sec-${id}" data-search="${esc(allTxt)}" data-n="${esc(String(p.n).toLowerCase())}" data-pname="${esc(p.n)}" data-mod="${m.id}">
  <div id="${id}" style="scroll-margin-top:60px"></div>
  <h3 class="pat pat-hd" data-hd="${id}"><span class="pat-hd-t">${ic(p.n)} ${esc(p.n)}</span><span class="pat-hd-d">${esc(p.d)}</span><span class="pat-arr">▾</span></h3>
  <div class="pat-body">
  <div class="pcard">${card}</div>
  </div>
  </div>`;
  return h;
}

   stage 仅输出空壳（含占位），交互由 initAllDemos 视口懒加载时填充。 */

/* 渲染主文档（全部模块） */
function renderAll(){

  LIBRARY.forEach(m=>{

    <p class="lead mod-lead">${m.lead}</p>`;
    // 完整详情
    m.patterns.forEach(p=>{ h+=patternHtml(m,p); });
    // 模块附录（仅 A 模块有 matrix/combos/pitfalls/checks）
    if(m.appendix) h+=renderAppendix(m,m.appendix);

  doc.innerHTML=h;
  initAllDemos();

}

/* 渲染模块附录（决策矩阵 / 组合方案 / 反例 / 检查清单） */
function renderAppendix(m,ap){
  let h='<hr class="appendix-sep">';
  function appx(title,mk,body){ return `<div class="appx"><button class="appx-hd" type="button"><span class="appx-t">${title}</span><span class="appx-mk">${mk||''}</span><span class="pat-arr">▾</span></button><div class="appx-bd">${body}</div></div>`; }
  if(ap.matrix){
    const tbl=`<p class="body" style="color:var(--muted);font-size:14px">● 高 ○ 低 · 评分用于比较相对特征，不代表都应采用高分入口。</p>
    <div style="overflow-x:auto"><table><tr><th style="white-space:nowrap"></th>${ap.matrix.cols.map(c=>`<th style="white-space:nowrap">${esc(c)}</th>`).join("")}</tr>`+ ap.matrix.rows.map(r=>`<tr><td style="white-space:nowrap"><b>${esc(String(r[0]))}</b></td>${r.slice(1,6).map(n=>`<td class="dots">${dots(n)}</td>`).join("")}<td style="white-space:nowrap;color:var(--blue);font-size:12px">${esc(String(r[6]||''))}</td></tr>`).join("")+`</table></div>`;
    h+=appx('决策矩阵','不是哪个最好，而是哪个适合此刻',tbl);
  }
  if(ap.combos&&ap.combos.length){
    const body=ap.combos.map(c=>`<div class="combo-row"><span class="combo-k">${esc(c[0])}</span><span class="combo-v">${esc(c[1])}</span></div>`).join("");
    h+=appx('组合方案','主入口 + 快捷入口 + 兜底入口',body);
  }
  if(ap.pitfalls&&ap.pitfalls.length){
    const body=ap.pitfalls.map(p=>`<div class="x"><span class="xn">×</span><span>${esc(p)}</span></div>`).join("");
    h+=appx('常见反例','越醒目越要负责',body);
  }
  if(ap.checks&&ap.checks.length){
    const body=ap.checks.map(c=>`<div class="check"><span>${esc(c)}</span></div>`).join("");
    h+=appx('上线前检查','能被看见 ≠ 设计完成',body);
  }
  return h;
}

    // 点击开合（排除拖动后的 click）
    ball.addEventListener("click",e=>{ if(drag)return; panel.classList.toggle("show"); });
    function startDrag(cx,cy){
      drag=false;
      const br=ball.getBoundingClientRect(); offX=cx-br.left; offY=cy-br.top;
      ball.classList.add("dragging");
      return {move:(nx,ny)=>{ drag=true;ball.classList.add("dragging");
        const r=st.getBoundingClientRect();
        let x=nx-offX-r.left,y=ny-offY-r.top;
        x=Math.max(0,Math.min(r.width-ball.offsetWidth,x));
        y=Math.max(0,Math.min(r.height-ball.offsetHeight,y));

        note.textContent="悬浮球拖动中…释放后自动吸边"; },
        up:()=>{ ball.classList.remove("dragging");

        const distL=bb.left-r.left,distR=r.right-bb.right;
        ball.style.transition="left .25s ease";
        if(distL<distR){ball.style.left="8px";}else{ball.style.left=(r.width-ball.offsetWidth-8)+"px";}
        ball.style.right="auto";
        setTimeout(()=>{ball.style.transition="";note.textContent=noteDefault;},300); }};

      const up=()=>{ d.up(); document.removeEventListener("mousemove",move); document.removeEventListener("mouseup",up); };

      const up=()=>{ d.up(); document.removeEventListener("touchmove",move); document.removeEventListener("touchend",up); };

    },{passive:false});

      const rect=range.getBoundingClientRect(),sr=st.getBoundingClientRect();
      bar.style.position="absolute";
      bar.style.left=Math.max(4,rect.left-sr.left)+"px";
      bar.style.top=Math.max(4,rect.top-sr.top-rect.height-44)+"px";

    const panel=st.querySelector("#cmdPanel-"+id),mask=st.querySelector("#cmdMask-"+id),
          input=st.querySelector("#cmdInput-"+id),list=st.querySelector("#cmdList-"+id),
          res=st.querySelector("#cmdRes-"+id);
    const cmds=[
      {t:"✦ AI 总结当前文档",g:"AI 指令"},{t:"✦ 根据文档生成周报",g:"AI 指令"},
      {t:"✦ 提取风险与待办",g:"AI 指令"},{t:"✦ AI 改写选中内容",g:"AI 指令"},
      {t:"跳转到「数据」",g:"导航"},{t:"新建文档",g:"常用"},{t:"导出 PDF",g:"常用"}
    ];
    function openCmd(){ panel.classList.add("show");mask.classList.add("show");setTimeout(()=>input.focus(),50);renderCmds(""); }
    function closeCmd(){ panel.classList.remove("show");mask.classList.remove("show"); }
    function renderCmds(q){
      const qq=q.trim().toLowerCase();
      const f=cmds.filter(c=>!qq||c.t.toLowerCase().includes(qq));
      list.innerHTML=f.map((c,i)=>`<div class="cmd-item2 ${i===0?"sel":""}" data-i="${i}"><span>${c.t}</span><span class="k">↵</span></div>`).join("")||'<div style="padding:10px;color:#999;font-size:13px">无结果</div>';
      list.querySelectorAll(".cmd-item2").forEach(el=>{
        el.addEventListener("mousemove",()=>{ list.querySelectorAll(".cmd-item2").forEach(x=>x.classList.remove("sel"));el.classList.add("sel"); });
        el.addEventListener("click",()=>{ runCmd(f[el.dataset.i].t); });
      });
    }
    function runCmd(t){ res.style.display="block";res.textContent="✨ 已执行：「"+t+"」";closeCmd(); }
    st.querySelector("#cmdOpen-"+id).addEventListener("click",openCmd);
    mask.addEventListener("click",closeCmd);
    input.addEventListener("input",()=>renderCmds(input.value));
    input.addEventListener("keydown",e=>{
      const items=[...list.querySelectorAll(".cmd-item2")];
      if(e.key==="ArrowDown"){e.preventDefault();const ci=items.findIndex(x=>x.classList.contains("sel"));if(ci>-1&&ci<items.length-1){items[ci].classList.remove("sel");items[ci+1].classList.add("sel");}}

      else if(e.key==="Enter"){const ci=items.findIndex(x=>x.classList.contains("sel"));if(ci>-1)runCmd(cmds.filter(c=>c.t.toLowerCase().includes(input.value.trim().toLowerCase()))[ci]?.t);}
      else if(e.key==="Escape"){closeCmd();}
    });
    document.addEventListener("keydown",e=>{
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();panel.classList.contains("show")?closeCmd():openCmd();}
    });
    renderCmds("");
    note.textContent="命令面板 · ⌘K 弹出 · 支持搜索 · ↑↓ 选择 · Enter 执行 · Esc 关闭";
  },

/* 初始化所有 demo 区 —— 手风琴 + 视口懒加载：
   demo 骨架已在 renderAll 输出（空 stage），仅当展开该模式、stage 进入视口附近时才构建该 demo 的交互（构建一次后保持）。 */
const DEMO_REG={}; // id → 构建器，供手风琴展开时按需构建
function initAllDemos(){
  const targets=[];
  LIBRARY.forEach(m=>{ m.patterns.forEach(p=>{
    const id=m.id+'-'+safename(p.n);
    if(SPECIFIC_DEMOS[p.n]){
      const stage=document.getElementById("dst-"+id), note=document.getElementById("dnt-"+id);
      if(stage) targets.push({el:stage,note,p,id,kind:'specific'});
    } else {
      const stage=document.getElementById("gen-"+id), note=document.getElementById("gnote-"+id);
      if(stage) targets.push({el:stage,note,p,id,kind:'generic'});
    }
  }); });
  function build(t){
    if(t._built) return; t._built=true;
    try{
      if(t.kind==='specific') SPECIFIC_DEMOS[t.p.n](t.el, t.note, t.p, t.id);
      else buildGenericDemo(t.el, t.note, t.p, t.id);
    }catch(err){ console.error('[demo] 构建失败:', t.p.n, err); t._built=false; }
  }
  targets.forEach(t=>{ DEMO_REG[t.id]={kind:t.kind,el:t.el,note:t.note,p:t.p,id:t.id,build:()=>build(t)}; });
  if(!('IntersectionObserver' in window)){ targets.forEach(build); return; }
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const t=targets.find(x=>x.el===en.target);
      if(t){ build(t); io.unobserve(en.target); }
    });
  },{rootMargin:'300px 0px',threshold:0});
  targets.forEach(t=>io.observe(t.el));
}
/* 手风琴展开某模式时，按需构建其容器内所有 demo（收起时 stage 在 display:none 内 IO 不触发，故展开时主动构建） */
function buildPatternDemos(id){
  const reg=DEMO_REG[id]; if(!reg) return;
  const sec=document.getElementById('sec-'+id); if(!sec) return;
  Object.keys(DEMO_REG).forEach(k=>{ const r=DEMO_REG[k]; if(r.el&&sec.contains(r.el)) r.build(); });
}

/* =====================================================================
   搜索：全文过滤模式详情块 + 侧栏 + 结果计数
   ===================================================================== */
function tokenize(t){ return (t||'').toLowerCase().split(/[\s,，。、;；\/|·：:]+/).map(x=>x.trim()).filter(Boolean); }
function doSearch(q){
  const qq=q.trim();
  const info=document.getElementById("searchBar");
  const secs=document.querySelectorAll('.pat-sec');
  if(!qq){ secs.forEach(s=>{s.classList.remove('search-hide'); clearMark(s);}); document.querySelectorAll('.side-item').forEach(i=>i.classList.remove('hide-item'));
    if(info){info.innerHTML='';info.classList.remove('show');} return; }
  const terms=tokenize(qq); // 多词
  // 先清掉上一轮所有高亮(含本次不再命中的)，避免 mark 残留
  secs.forEach(s=>clearMark(s));
  let results=[];
  secs.forEach(s=>{
    const idx=(s.getAttribute('data-search')||'').toLowerCase();
    const nm=(s.getAttribute('data-n')||'').toLowerCase();
    // 每个词都需命中(AND)，词序无关
    const allHit=terms.every(t=>idx.includes(t));
    if(!allHit){ s.classList.add('search-hide'); clearMark(s); return; }
    s.classList.remove('search-hide');
    let score=0;
    terms.forEach(t=>{ if(nm.includes(t)) score+=10; if(idx.indexOf(t)<=idx.indexOf(nm)+nm.length) score+=1; });
    results.push({s,score});
    // 展开并高亮
    s.classList.add('open'); const hd=s.querySelector('.pat-hd'); if(hd) buildPatternDemos(hd.getAttribute('data-hd'));
  });
  // 相关度排序：名称命中优先
  results.sort((a,b)=>b.score-a.score);
  // 注意：就地显示不重排 DOM（避免打乱模块分组结构）
  results.forEach(r=>{ hlTerms(r.s, terms); });
  // 侧栏联动
  document.querySelectorAll('.side-item').forEach(it=>{
    const href=it.getAttribute('href')||''; if(href==="#top"||href==="#cover")return;
    const sec=document.getElementById(href.slice(1));
    const keep=sec&&!sec.classList.contains('search-hide');
    it.classList.toggle('hide-item',!keep);
    if(keep){ const body=it.closest('.side-cat-body'); if(body&&body.classList.contains('collapsed')){ body.classList.remove('collapsed');
      const cat=body.previousElementSibling; if(cat&&cat.classList.contains('side-cat')){cat.classList.remove('collapsed');cat.setAttribute('aria-expanded','true');} } }
  });
  // 命中模块聚合（去重），"标题词被命中"的模块判定
  const hitMods=[]; const modSeen=new Set();
  results.forEach(r=>{
    const mid=r.s.getAttribute('data-mod');
    if(!mid||modSeen.has(mid))return; modSeen.add(mid);
    const mhd=document.getElementById(mid);
    if(mhd&&mhd.classList&&mhd.classList.contains('sec')){
      const txt=(mhd.textContent||'').toLowerCase();
      const titleIsHit=terms.every(t=>txt.includes(t));
      hitMods.push({id:mid,el:mhd,titleIsHit,title:(mhd.textContent||'').trim()});
    }
  });
  hitMods.sort((a,b)=>(b.titleIsHit?1:0)-(a.titleIsHit?1:0));
  if(info){
    info.classList.add('show');
    let modBlock='';
    if(hitMods.length){
      modBlock=`<div class="mod-hits"><span class="mh-lb">命中模块</span>`
        +hitMods.map(m=>`<span class="mod-jump" data-mod="${m.id}" ${m.titleIsHit?'style="outline:2px solid rgba(233,160,0,.7);outline-offset:-1px"':''}>${esc(m.title)}</span>`).join('')
        +`</div>`;
    }
    info.innerHTML=`<div class="searchinfo">`+modBlock
      +(results.length?`搜索 “${qq}” · <b>${results.length}</b> 个结果`:`搜索 “${qq}” 无结果`)
      +` <span class="clear" onclick="document.getElementById('searchInput').value='';doSearch('')">✕ 清空</span></div>`;
    const jumps=info.querySelectorAll('.mod-jump');
    jumps.forEach(j=>{ j.onclick=function(ev){ ev.preventDefault(); const t=document.getElementById(j.getAttribute('data-mod')); if(t){ t.scrollIntoView({behavior:'smooth',block:'start'}); } }; });
  }
  // 标题词被命中的模块 → 平滑滚动定位到首个，使模块大标题高亮可见
  const firstHit=hitMods.find(m=>m.titleIsHit);
  if(firstHit&&firstHit.el){ try{ firstHit.el.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){} }
}
/* 高亮命中词(支持多词，不嵌套mark)：遍历 模块标题+.pat-hd-t/.pat-hd-d 文本节点，对命中的词包 <mark> */
function hlTerms(sec,terms){
  const modId=sec.getAttribute('data-mod');
  const modHd=modId?document.getElementById(modId):null;
  const tgt=[...(modHd&&modHd.classList&&modHd.classList.contains('sec')?[modHd]:[]), ...sec.querySelectorAll('.pat-hd-t,.pat-hd-d')];
  tgt.forEach(el=>{
    if(!el) return;
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
    const nodes=[]; let n;
    while((n=walker.nextNode())){
      // 跳过已处于 mark 内的文本节点(避免嵌套)
      let p=n.parentNode, inside=false;
      while(p&&p!==el){ if(p.nodeName==='MARK'){inside=true;break;} p=p.parentNode; }
      if(!inside) nodes.push(n);
    }
    nodes.forEach(tn=>{
      const low=tn.nodeValue.toLowerCase();
      // 收集该文本节点命中词集合(按出现位置)
      const hits=[];
      terms.forEach(t=>{ if(low.includes(t)) hits.push(t); });
      if(!hits.length) return;
      let frag; const text=tn.nodeValue;
      // 简化：仅当文本含某词时在该词外包mark，多词逐词处理易重叠 → 用一个顺序扫描
      frag=document.createDocumentFragment(); let pos=0; const used=new Set();
      // 对每个位置找最早出现的任一命中词
      while(pos<text.length){
        let best=null, bp=-1;
        terms.forEach(t=>{ const li=low.indexOf(t,pos); if(li!==-1&&(bp===-1||li<bp)){bp=li;best=t;} });
        if(best===null||bp===-1){ frag.appendChild(document.createTextNode(text.slice(pos))); pos=text.length; break; }
        if(bp>pos) frag.appendChild(document.createTextNode(text.slice(pos,bp)));
        const mk=document.createElement('mark'); mk.className='hl'; mk.textContent=text.slice(bp,bp+best.length); frag.appendChild(mk);
        pos=bp+best.length;
      }
      tn.parentNode.replaceChild(frag,tn);
    });
  });
}
function hlNode(sec,t){ hlTerms(sec,[t]); }
function clearMark(sec){
  const scope=[sec];
  const mid=sec.getAttribute('data-mod');
  const hd=mid?document.getElementById(mid):null;
  if(hd&&hd.classList&&hd.classList.contains('sec')) scope.push(hd);
  scope.forEach(el=>el.querySelectorAll('mark.hl').forEach(mk=>{ const p=mk.parentNode; p.replaceChild(document.createTextNode(mk.textContent),mk); p.normalize(); }));
}

/* 滚动高亮：侧栏当前模式 + crumb 更新 */
(function spy(){
  const cats=document.querySelectorAll('.side-cat');
  const catMap={}; cats.forEach(c=>catMap[c.dataset.cat]=c);
  const items=document.querySelectorAll('.side-item');
  const itemTargets=[...items].map(a=>{const href=a.getAttribute('href');return href&&href.startsWith('#')&&href.length>1?{a,href,el:document.getElementById(href.slice(1))}:null;}).filter(Boolean);
  // 模块级边界：每模块的 h2.sec（id=m.id）作为该模块起点
  const modAnchors=LIBRARY.map(m=>({id:m.id,el:document.getElementById(m.id)}));
  function currentMod(pos){
    let curId=null;
    for(const x of modAnchors){ if(x.el&&x.el.offsetTop<=pos) curId=x.id; }
    return curId;
  }
  function update(){
    const pos=window.scrollY+100;
    const mod=currentMod(pos);
    // 当前模式条目高亮
    let curItem=null;
    for(const t of itemTargets){ if(t.el&&t.el.offsetTop<=pos) curItem=t; }
    items.forEach(i=>i.classList.remove('on'));
    if(mod){
      const body=document.querySelector(`[data-body="${mod}"]`);
      if(body&&body.classList.contains('collapsed')) body.classList.remove('collapsed');
      const cat=catMap[mod];
      if(cat){ cat.classList.remove('collapsed'); cat.setAttribute('aria-expanded','true'); }
    }
    if(curItem){ curItem.a.classList.add('on');
      const secEl=curItem.el.closest?curItem.el.closest('.pat-sec'):curItem.el.parentElement;
      const cmod=secEl?secEl.getAttribute('data-mod'):null, pn=secEl?secEl.getAttribute('data-pname'):null;
      const sb=document.getElementById("crumbNow"); if(sb) sb.textContent=(cmod?cmod+' ':'')+(pn||"总览");
    } else {
      // 滚到顶部总览区：保底选中第一个模式「导航栏按钮」，不清除
      if(itemTargets.length){ itemTargets[0].a.classList.add('on'); }
      const sb=document.getElementById("crumbNow"); if(sb) sb.textContent="总览";
    }
  }
  window.addEventListener('scroll',update,{passive:true});
  try{ update(); }catch(e){ console.error('[spy] init error',e); }
})();
</script>
