<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 交互设计图鉴 · A–G</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111214; --paper:#f5f4f1; --anchor:#FF2A00; --anchor-d:#cc2200;
    --line:#c9c7c2; --grey:#6b6b66; --panel:#faf9f7;
    --mono:"IBM Plex Mono",monospace; --sans:"Archivo","Noto Sans SC",sans-serif;
    --disp:"Space Grotesk","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:64px}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.7}

  /* ===== 顶部固定导航 ===== */
  nav.top{position:fixed;top:0;left:0;right:0;z-index:50;height:56px;display:flex;align-items:center;gap:14px;
    padding:0 4vw;background:var(--paper);border-bottom:1px solid var(--ink)}
  .nav-brand{font-family:var(--mono);font-size:11px;letter-spacing:.06em;white-space:nowrap;display:flex;gap:8px;align-items:center}
  .nav-brand b{color:var(--anchor)}
  .nav-links{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{font-family:var(--mono);font-size:11px;text-decoration:none;color:var(--ink);padding:4px 9px;border:1px solid transparent;white-space:nowrap;transition:.15s}
  .nav-links a:hover{border-color:var(--ink)}
  .nav-links a.on{background:var(--anchor);border-color:var(--anchor);color:#fff}
  .nav-prog{font-family:var(--mono);font-size:10px;color:var(--grey);white-space:nowrap}

  main{max-width:1180px;margin:0 auto;padding:84px 5vw 80px}

  /* ===== 封面 hero ===== */
  .hero{padding:40px 0 30px;border-bottom:3px solid var(--ink);margin-bottom:0}
  .hero .kick{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--anchor);text-transform:uppercase;margin-bottom:14px}
  .hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(40px,7vw,96px);line-height:.92;letter-spacing:-.03em;text-transform:uppercase}
  .hero h1 em{color:var(--anchor);font-style:normal}
  .hero p{max-width:66ch;color:#333;font-weight:300;font-size:16px;margin-top:18px}
  .hero .toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:36px}
  .toc a{background:var(--paper);padding:14px;display:flex;gap:12px;align-items:baseline;text-decoration:none;color:var(--ink);transition:.15s}
  .toc a:hover{background:#fff}
  .toc .no{font-family:var(--mono);font-size:20px;color:var(--anchor);font-weight:600}
  .toc .t{font-weight:700;font-size:14px;text-transform:uppercase;font-family:var(--disp)}
  .toc .n{font-family:var(--mono);font-size:9.5px;color:var(--grey)}

  /* ===== 模块区块 ===== */
  section.mod{padding:54px 0 20px;border-top:1px solid var(--line)}
  .mod-head{display:grid;grid-template-columns:78px 1fr;gap:22px;align-items:baseline;padding-bottom:18px;border-bottom:1px solid var(--ink);margin-bottom:26px}
  .mod-no{font-family:var(--disp);font-weight:800;font-size:52px;line-height:.9;color:var(--anchor);letter-spacing:-.02em}
  .mod-tit h2{font-family:var(--disp);font-weight:700;font-size:clamp(24px,3.4vw,40px);text-transform:uppercase;letter-spacing:-.01em;line-height:1}
  .mod-tit .en{font-family:var(--mono);font-size:10.5px;color:var(--grey);letter-spacing:.16em;text-transform:uppercase;margin-top:6px}
  .mod-intro{font-size:15px;color:#333;font-weight:300;max-width:80ch}

  /* ===== 模式卡片网格 ===== */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:24px}
  .card{background:var(--paper);padding:20px 18px;display:flex;flex-direction:column;gap:7px}
  .card:hover{background:#fff}
  .card .top{display:flex;gap:10px;align-items:center}
  .card .emo{font-size:22px}
  .card h3{font-family:var(--disp);font-weight:600;font-size:16px;line-height:1.2}
  .card .cat{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--grey);text-transform:uppercase}
  .card .d{font-size:13px;color:#555;font-weight:300;flex:1}
  .card .refs{font-family:var(--mono);font-size:10px;color:var(--grey);padding-top:6px;border-top:1px dotted var(--line)}

  /* ===== 详细字段区块 ===== */
  .det-sec{margin-top:34px}
  .det-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
  .det-cell{background:var(--paper);padding:16px 18px}
  .det-cell h4{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--anchor);text-transform:uppercase;margin-bottom:8px}
  .det-cell p,.det-cell li{font-size:13.5px;color:#2c2c2e;font-weight:300;line-height:1.7}
  .det-cell ul{padding-left:16px}
  .full{grid-column:1/-1}

  .cat-grp{margin-bottom:8px}
  .cat-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--anchor);text-transform:uppercase;margin:26px 0 4px;display:flex;align-items:center;gap:10px}
  .cat-label::after{content:"";flex:1;height:1px;background:var(--line)}

  /* 矩阵 / 表 */
  .table-wrap{margin-top:22px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--paper)}
  th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);text-align:left;padding:9px;border-bottom:2px solid var(--ink);white-space:nowrap}
  td{padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
  tr:hover td{background:#fff}
  td.dots{font-family:var(--mono);font-size:11px}
  td.rn{font-family:var(--disp);font-weight:600}
  td.dest{font-family:var(--mono);font-size:10px;color:var(--anchor);font-weight:500}

  /* 三栏组合 / 双栏 */
  .cols{display:grid;grid-template-columns:1.2fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:22px}
  .col{background:var(--paper);padding:20px 22px}
  .col h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:14px}
  .combo{margin-bottom:12px;padding:12px;border-left:3px solid var(--ink);background:#fff}
  .combo .t{font-weight:700;font-size:13px;font-family:var(--disp)}
  .combo .f{font-family:var(--mono);font-size:11px;color:var(--anchor);margin-top:3px}
  .chk{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px;font-size:13.5px;font-weight:300;cursor:pointer}
  .chk input{margin-top:4px;accent-color:var(--anchor)}
  .xn{color:var(--anchor);font-family:var(--mono);font-weight:700}

  .goback{display:inline-block;margin-top:20px;font-family:var(--mono);font-size:11px;color:var(--ink);border:1.5px solid var(--ink);padding:7px 12px;text-decoration:none;text-transform:uppercase}
  .goback:hover{background:var(--ink);color:var(--paper)}

  .goup{position:fixed;right:22px;bottom:22px;z-index:40;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .goup:hover{background:var(--ink);color:var(--paper)}

  footer{border-top:1px solid var(--ink);margin-top:30px;padding:26px 0 40px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--grey);letter-spacing:.08em;text-transform:uppercase}

  @media(max-width:760px){.det-grid,.cols{grid-template-columns:1fr}.mod-head{grid-template-columns:56px 1fr}.mod-no{font-size:40px}}
</style>
</head>
<body>

<nav class="top">
  <span class="nav-brand"><b>AI</b> 交互设计图鉴</span>
  <div class="nav-links" id="navLinks"></div>
  <span class="nav-prog" id="navProg">A–G</span>
</nav>

<main>
  <header class="hero" id="cover">
    <div class="kick">AI Interaction Pattern Library · A–G</div>
    <h1>AI 交互<br>设计图鉴<em>.</em></h1>
    <p>覆盖 AI 产品从入口、输入、过程、输出，到角色、异常与信任的七个核心设计维度，共 60+ 种可参考的设计模式。每一种都包含适用场景、实现要点、关键取舍与无障碍要求。</p>
    <div class="toc" id="toc"></div>
  </header>

  <div id="mods"></div>
</main>

<button class="goup" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到顶部">↑</button>

<footer>
  <span>AI 交互设计图鉴 · 知识 HTML</span>
  <span>内容整理自 youthce.com 设计模式库 · 瑞士国际主义风排版</span>
</footer>

<script>
/* ============================================================
   数据层 —— 后续新增 B–G 模块只需往 MODULES 数组加对象
   ============================================================ */
const MODULES = [
{
  id:"A", no:"A", title:"入口设计", en:"The Entry",
  intro:"入口设计决定用户在什么时刻、从哪里唤起 AI，以及系统会带入哪些任务上下文。好的入口不只要容易找到，更要贴近当前任务，并让用户清楚知道点击后会发生什么。",
  groups:[
    {name:"常驻入口", items:["导航栏按钮","悬浮球","工具栏图标"]},
    {name:"上下文入口", items:["划词唤起","右键菜单","就近触发"]},
    {name:"效率入口", items:["命令面板"]},
    {name:"新手入口", items:["空状态引导"]}
  ],
  cards:[
    {emo:"🧭",n:"导航栏按钮",cat:"常驻",d:"把 AI 放在产品最稳定的位置，作为一级功能入口。",refs:"Gemini · Slack · Linear",link:"#e0"},
    {emo:"🔵",n:"悬浮球",cat:"常驻",d:"始终停留界面边缘的全局入口，跨页面随时唤起。",refs:"Copilot · Intercom · Crisp",link:"#e1"},
    {emo:"🛠️",n:"工具栏图标",cat:"常驻",d:"AI 作为编辑能力的一部分，即时改写总结生成。",refs:"WPS AI · Figma · Canva",link:"#e2"},
    {emo:"✍️",n:"划词唤起",cat:"上下文",d:"选中内容后出现，选区即任务上下文。",refs:"Notion · Craft · 沉浸翻译",link:"#e3"},
    {emo:"🖱️",n:"右键菜单",cat:"上下文",d:"把 AI 放进对象原有操作路径，低频进阶。",refs:"VS Code · Cursor · Figma",link:"#e4"},
    {emo:"📍",n:"就近触发",cat:"上下文",d:"贴在段落/单元格/卡片旁，对象级局部任务。",refs:"Notion · Coda · 飞书",link:"#e5"},
    {emo:"⌨️",n:"命令面板",cat:"效率",d:"⌘K 让熟练用户不离开键盘启动任务。",refs:"Linear · Raycast · VS Code",link:"#e6"},
    {emo:"🪧",n:"空状态引导",cat:"新手",d:"首次进入给 3 条可点击示例，降低门槛。",refs:"ChatGPT · Claude · Notion",link:"#e7"}
  ],
  details:[
    {id:"e0", name:"导航栏按钮", icon:"🧭", cat:"常驻入口",
     use:"AI 是产品核心卖点、需要高曝光，或要在用户心智里确立「这是个 AI 产品」时。",
     diff:"可发现性最高、位置最稳定，但与用户正在处理的具体内容距离较远，占用稀缺的一级导航空间。",
     how:["文字标签 + 图标，别只放图标（可发现性）","有选中/激活态，与面板开合联动","位置稳定、跨页面一致"],
     trade:"导航位稀缺，放上去就要为它的点击率负责；AI 不够高频或成熟时，占一级入口反而喧宾夺主。",
     refs:"Gmail Gemini · Slack · Linear",
     avoid:"AI 仍是低频试验能力，或无法跨页面保持稳定体验时，不要过早占据一级导航资源。",
     states:["默认","悬停/聚焦","当前页","面板展开","新结果","不可用"],
     metrics:["导航点击率","任务发起率","重复访问率"],
     rel:"主任务入口 · 导航项 · 状态徽标 · 侧边面板",
     trigger:"始终位于稳定导航位置；进入后保留当前页面作为可选上下文。入口激活状态与页面/侧栏/面板开合保持同步。",
     platform:"桌面用顶栏或侧栏；移动端进主导航或底部一级入口，避免藏在多层汉堡菜单里。",
     a11y:"用真实导航链接/按钮并标识当前状态；图标旁保留文字。名称表达价值，如「生成周报」而非「智能」。"},
    {id:"e1", name:"悬浮球", icon:"🔵", cat:"常驻入口",
     use:"需要全局常驻、随时可唤起，又不想长期占用固定版面；尤其适合内容长、需持续滚动的编辑类产品。",
     diff:"比导航按钮更靠近当前内容，不随页面滚动消失；代价是持续占用视觉注意力，可能遮挡内容。",
     how:["可拖拽 + 自动吸边，不遮挡正文","红点/数字做未读或建议提醒","点击展开面板、再点收起，状态清晰","沉浸编辑时也保持可达"],
     trade:"移动端易误触，需有收起态与足够安全边距；长期悬浮会和正文争注意力，默认低调、激活才强调。",
     refs:"微软 365 Copilot · Intercom · Crisp",
     avoid:"有固定底部操作、局部任务多于全局任务，或悬浮按钮遮挡正文和关键控件时不应使用。",
     states:["默认","悬停/聚焦","新提醒","拖动中","面板展开","不可用"],
     metrics:["入口点击率","唤起后任务发起率","误触关闭率"],
     rel:"AI 唤起 · 继续任务 · 浮动按钮 · 徽标 · 侧边面板",
     trigger:"常驻显示；点击或键盘确认后展开。新结果徽标只表达状态，不擅自打开。默认携带当前页面/项目上下文并在面板顶部说明范围。",
     platform:"桌面可拖动并自动吸边；移动端保持稳定位置，避开底部导航、键盘与安全区域，不把拖动作为必要操作。",
     a11y:"用有名称的按钮，支持 Enter/Space 与清晰焦点；提醒不只靠红点颜色；持续呼吸动画应允许减少。文案写「AI 助手」或具体任务。"},
    {id:"e2", name:"工具栏图标", icon:"🛠️", cat:"常驻入口",
     use:"文档、表格、设计稿等编辑场景内，对当前正在写的内容做即时处理。",
     diff:"比导航入口更贴近当前任务，比划词入口覆盖更广；上下文通常只精确到当前文档或编辑器。",
     how:["紧贴编辑区，图标语义清晰（✦/魔法棒等约定）","与其他工具风格统一、不突兀","通常配合「选中内容」使用"],
     trade:"工具条空间有限，图标多则拥挤；AI 项要有足够辨识度，否则淹没在一排格式按钮里。",
     refs:"WPS AI · Figma · Canva",
     avoid:"非编辑/操作场景、AI 不依赖当前内容，或工具栏已高度拥挤时应避免。",
     states:["默认","悬停/聚焦","已有选区","禁用","菜单展开","执行中"],
     metrics:["工具栏使用率","任务完成率","执行后撤销率"],
     rel:"快捷任务 · 图标按钮 · 工具提示 · 动作菜单",
     trigger:"编辑器获焦或存在可处理内容时可用；依赖选区时，未选中应禁用并解释原因。打开后默认携带当前文档或编辑对象。",
     platform:"桌面可进固定工具栏；移动端收进选中文本后操作条或「更多」菜单，保留足够触控面积。",
     a11y:"图标按钮必须有可访问名称与工具提示；禁用不只降透明度。文案直接写结果，如「改写」「生成摘要」。"},
    {id:"e3", name:"划词唤起", icon:"✍️", cat:"上下文入口",
     use:"针对「选中的具体内容」做即时操作，且操作类型相对固定、可枚举。",
     diff:"上下文精度高于工具栏和导航，默认不占空间；缺点是要先完成「选中内容」这个动作。",
     how:["浮条紧贴选区上方，不遮住选中内容","只放最高频动作，避免长菜单","跟随选区变化、选区消失即收起","AI 项与普通格式操作做视觉区分"],
     trade:"选区丢失要立刻收起，否则浮条悬空；动作堆多会让浮条变长，失去「轻」的优势。",
     refs:"Notion · Craft · 沉浸式翻译",
     avoid:"对象非文字、移动端占比高，或选中内容涉及敏感信息且读取范围无法说明时应避免。",

     metrics:["选区触发率","任务完成率","浮条关闭率"],
     rel:"上下文推荐 · 选区浮条 · 快捷任务 · 命令菜单",
     trigger:"仅在有效选区时出现，明确只读取所选内容；选区变化或失焦及时收起，执行期间保存原选区引用。",

     a11y:"不只依赖鼠标划选；支持键盘选文后触发。浮条不抢焦点，关闭后焦点回原文。动作写「改写选中内容」等明确文案。"},
    {id:"e4", name:"右键菜单", icon:"🖱️", cat:"上下文入口",

     how:["AI 项单独分组、带图标，与系统项区隔","遵循系统右键排序与习惯","菜单项随选中对象动态变化"],

/* ============================================================
   渲染层
   ============================================================ */
function dots(n){let s="";for(let i=0;i<5;i++)s+=i<n?"●":"○";return s;}

/* 目录 TOC */
const toc=document.getElementById("toc");
MODULES.forEach((m,i)=>{
  const a=document.createElement("a");
  a.href="#mod-"+m.id;
  a.innerHTML=`<span class="no">${m.no}</span><span><span class="t">${m.title}</span><br><span class="n">${m.cards.length} 种模式</span></span>`;
  toc.appendChild(a);
});

/* 顶部导航 */
const nav=document.getElementById("navLinks");
[{id:"cover",t:"封面"}].concat(MODULES.map(m=>({id:"mod-"+m.id,t:m.id}))).forEach(x=>{
  const a=document.createElement("a");
  a.href="#"+x.id; a.textContent=x.t;
  nav.appendChild(a);
});

/* 模块主体 */
const modsWrap=document.getElementById("mods");
MODULES.forEach((m)=>{
  const sec=document.createElement("section");
  sec.className="mod"; sec.id="mod-"+m.id;

  /* 组指示 */
  const catRow=m.groups.map(g=>`${g.name} · ${g.items.length}`).join("　");
  let html=`
    <div class="mod-head">
      <div class="mod-no">${m.no}</div>
      <div class="mod-tit"><h2>${m.title}</h2><div class="en">${m.en} · ${catRow}</div></div>
    </div>
    <p class="mod-intro">${m.intro}</p>`;

  /* 模式卡片 */
  html+=`<div class="card-grid">`+
    m.cards.map(c=>`<a class="card" href="${c.link}">
        <div class="top"><span class="emo">${c.emo}</span><h3>${c.n}</h3></div>
        <span class="cat">${c.cat}</span>
        <span class="d">${c.d}</span><span class="refs">${c.refs}</span></a>`).join("")+
    `</div>`;

  sec.innerHTML=html;
  modsWrap.appendChild(sec);

  /* 详情区块（每模式一个 det-sec）*/
  m.details.forEach(d=>{
    const dsec=document.createElement("div");
    dsec.className="det-sec"; dsec.id=d.id;
    dsec.innerHTML=`
      <div class="det-grid">
        <div class="det-cell full"><h4>${d.icon} ${d.name} · ${d.cat} — 概览</h4><p>${d.use}</p></div>
        <div class="det-cell"><h4>与其他入口的差别</h4><p>${d.diff}</p></div>
        <div class="det-cell"><h4>怎么实现</h4><ul>${d.how.map(h=>`<li>${h}</li>`).join("")}</ul></div>
        <div class="det-cell"><h4>关键取舍</h4><p>${d.trade}</p></div>
        <div class="det-cell"><h4>参考产品</h4><p>${d.refs}</p></div>
        <div class="det-cell"><h4>避免使用</h4><p>${d.avoid}</p></div>
        <div class="det-cell"><h4>关键状态</h4><p>${d.states.join(" · ")}</p></div>
        <div class="det-cell"><h4>关注指标</h4><p>${d.metrics.join(" · ")}</p></div>
        <div class="det-cell"><h4>关联模式 / 组件</h4><p>${d.rel}</p></div>
        <div class="det-cell full"><h4>触发与上下文</h4><p>${d.trigger}</p></div>
        <div class="det-cell"><h4>桌面 / 移动策略</h4><p>${d.platform}</p></div>
        <div class="det-cell"><h4>无障碍与文案</h4><p>${d.a11y}</p></div>
      </div>`;
    sec.appendChild(dsec);
  });

  /* 决策矩阵 */
  if(m.matrix){
    const mx=m.matrix;
    html=`<h4 style="font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--anchor);margin-top:40px">决策矩阵 · 不是哪个最好，而是哪个适合此刻</h4>
    <div class="table-wrap"><table><tr><th>${mx.head}</th>${mx.cols.map(c=>`<th>${c}</th>`).join("")}<th>更适合</th></tr>`+
    mx.rows.map(r=>`<tr><td class="rn">${r[0]}</td>${r.slice(1,6).map(n=>`<td class="dots">${dots(n)}</td>`).join("")}<td class="dest">${r[6]}</td></tr>`).join("")+
    `</table></div>`;
    const dv2=document.createElement("div"); dv2.innerHTML=html;
    while(dv2.firstChild) sec.appendChild(dv2.firstChild);
  }

  /* 组合方案 + 反例 */
  html=`<div class="cols"><div class="col"><h4>组合方案 · 主 + 快捷 + 兜底</h4>`+
    m.combos.map(c=>`<div class="combo"><div class="t">${c[0]}</div><div class="f">${c[1]}</div></div>`).join("")+
    `</div><div class="col"><h4>常见反例 · 越醒目越要负责</h4>`+
    m.pitfalls.map(p=>`<div style="display:flex;gap:9px;align-items:baseline;margin-bottom:10px;font-size:13.5px;font-weight:300"><span class="xn">×</span>${p}</div>`).join("")+
    `</div></div>`;
  const cv=document.createElement("div"); cv.innerHTML=html; sec.appendChild(cv);

  /* 上线前检查 */
  if(m.checks){
    html=`<h4 style="font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--anchor);margin-top:36px">上线前检查 · 能被看见 ≠ 设计完成</h4>
    <div class="cols"><div class="col">`+
    m.checks.map(c=>`<label class="chk"><input type="checkbox">${c}</label>`).join("")+
    `</div></div>`;
    const chv=document.createElement("div"); chv.innerHTML=html; sec.appendChild(chv);
  }
});
</script>
</body>
</html>
