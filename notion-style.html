<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 交互设计知识库</title>
<style>
  :root{
    --bg:#ffffff; --sidebar:#f7f7f5; --text:#37352f; --muted:#787774;
    --border:#e9e9e7; --accent:#37352f; --accent-bg:#f1f1ef;
    --hover:#f1f1ef; --blue:#0b6bcf; --code-bg:#f7f6f3;
    --serif:ui-serif,Georgia,"Songti SC",serif;
    --sans:ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;font-size:16px}

  /* ===== 顶栏 ===== */
  .topbar{position:sticky;top:0;z-index:50;height:45px;background:var(--bg);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:8px;padding:0 14px}
  .topbar .menu{font-size:16px;color:var(--muted);background:none;border:none;cursor:pointer;width:30px;height:30px;border-radius:6px}
  .topbar .menu:hover{background:var(--hover)}
  .searchbox{flex:1;max-width:360px;display:flex;align-items:center;gap:6px;background:var(--hover);
    border-radius:6px;padding:4px 10px;font-size:14px}
  .searchbox input{border:none;background:transparent;outline:none;flex:1;font-size:14px;color:var(--text)}
  .crumb{font-size:13px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:auto}

  /* ===== 侧栏 ===== */
  .sidebar{position:fixed;top:45px;bottom:0;left:0;width:260px;background:var(--sidebar);border-right:1px solid var(--border);
    overflow-y:auto;padding:14px 10px;transition:transform .2s ease;z-index:40}
  .sidebar.closed{transform:translateX(-100%)}
  .side-title{font-size:13px;font-weight:600;padding:4px 8px 10px;display:flex;align-items:center;gap:6px}
  .side-title .dot{width:18px;height:18px;background:#000;color:#fff;border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:600}
  .side-group{padding:4px 8px}
  .side-group>div{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:3px}
  .side-item{display:block;font-size:13.5px;color:var(--text);text-decoration:none;padding:3px 8px;border-radius:4px;margin:1px 0}
  .side-item:hover{background:var(--hover)}
  .side-item.dim{color:var(--muted)}
  .side-item.on{background:var(--accent-bg);font-weight:500}

  /* ===== 主内容 ===== */
  .content{transition:margin-left .2s ease}
  .content.shifted{margin-left:260px}
  .doc{max-width:760px;margin:0 auto;padding:48px 40px 120px}
  .doc-head{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:20px}
  .doc-head b{color:var(--text)}
  h1.title{font-size:40px;font-weight:800;line-height:1.2;letter-spacing:-.01em;margin-bottom:14px}
  .lead{color:var(--text);font-size:17px;line-height:1.7}
  .doc-sep{border:none;border-top:1px solid var(--border);margin:36px 0}
  .searchinfo{background:#fbfbfa;border:1px solid var(--border);border-radius:8px;padding:14px 18px;font-size:14px;color:var(--muted)}
  .searchinfo b{color:var(--text)}
  .searchinfo .clear{color:var(--blue);cursor:pointer;margin-left:8px}

  /* Notion 风格正文块 */
  h2.sec{font-size:26px;font-weight:700;margin:42px 0 12px;padding-top:10px;letter-spacing:-.01em}
  h3.pat{font-size:19px;font-weight:600;margin:30px 0 6px}
  p.body{color:var(--text);margin:8px 0}
  .field-label{font-size:13px;font-weight:500;color:var(--muted);margin:14px 0 4px;display:flex;align-items:center;gap:6px}
  .field-label::before{content:"";width:10px;height:10px;background:#fff;border:1px solid var(--muted);border-radius:2px}
  .field-val{font-size:15px;padding-left:2px}
  .field-val ul{padding-left:20px}
  .field-val li{margin:3px 0}
  .pill{display:inline-block;background:var(--hover);border-radius:3px;padding:1px 6px;font-size:12.5px;color:var(--muted);margin-right:6px}
  .ref-line{font-size:14px;color:var(--muted);font-style:normal}
  .quote{border-left:3px solid var(--text);background:var(--accent-bg);padding:10px 16px;margin:12px 0;border-radius:0 4px 4px 0;font-size:15px}

  /* 卡片（总览用）*/
  .pat-card{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin:12px 0;cursor:pointer;transition:background .12s}
  .pat-card:hover{background:#f9f9f8}
  .pat-card .pn{font-size:16px;font-weight:600}
  .pat-card .pd{font-size:14px;color:var(--muted);margin-top:2px}

  /* 目录大纲（文档顶部）*/
  .outline{background:#fbfbfa;border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin:28px 0}
  .outline .ot{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
  .outline a{display:block;color:var(--text);text-decoration:none;font-size:14.5px;padding:3px 0}
  .outline a:hover{color:var(--blue)}
  .outline a.sub{padding-left:20px;font-size:13.5px;color:var(--muted)}

  /* 表格 */
  table{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0}
  th{font-size:12.5px;color:var(--muted);font-weight:500;text-align:left;border-bottom:1px solid var(--text);padding:6px 8px}
  td{border-bottom:1px solid var(--border);padding:7px 8px;vertical-align:top}
  td.dots{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--muted)}

  /* 检查清单 */
  .check{border-top:1px solid var(--border);padding:8px 0;display:flex;gap:10px;font-size:15px;align-items:flex-start}
  .check input{margin-top:4px;accent-color:#111}

  .toplink{display:inline-block;margin-top:20px;color:var(--blue);font-size:14px;text-decoration:none}

  /* ===== 交互 demo 区 ===== */
  .demo-area{border:1px solid var(--border);border-radius:10px;margin:20px 0 8px;overflow:hidden}
  .demo-head{background:#fbfbfa;padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border)}
  .demo-stage{position:relative;background:linear-gradient(180deg,#f7f6f3,#efece8);padding:22px;min-height:200px;overflow:hidden}
  .demo-note{background:#fbfbfa;padding:7px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
  .demo-paper{background:#fff;border:1px solid var(--border);border-radius:6px;padding:18px;max-width:420px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .demo-paper b{font-size:15px;display:block;margin-bottom:8px}
  .demo-paper p{font-size:13.5px;color:#444;margin:6px 0}
  /* 悬浮球 */
  .floatball{position:absolute;right:18px;bottom:16px;width:44px;height:44px;border-radius:50%;
    background:#111;color:#fff;display:grid;place-items:center;font-size:20px;cursor:grab;
    box-shadow:0 4px 14px rgba(0,0,0,.25);user-select:none;z-index:5}
  .floatball.dragging{cursor:grabbing;opacity:.85}
  .floatpanel{position:absolute;right:18px;bottom:70px;width:230px;background:#fff;border:1px solid var(--border);
    border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:14px;display:none;z-index:6}
  .floatpanel.show{display:block}
  .floatpanel b{font-size:14px;display:block;margin-bottom:6px}
  .fp-s{font-size:12px;color:#666;margin-bottom:10px;line-height:1.5}
  .fp-btn{display:block;width:100%;text-align:left;background:#f7f7f5;border:1px solid var(--border);
    border-radius:6px;padding:7px 10px;margin:5px 0;font-size:13px;color:var(--text);cursor:pointer}
  .fp-btn:hover{background:#fff;border-color:#bbb}
  .fp-result{margin-top:10px;font-size:12.5px;color:#0b6bcf;background:#eef4fb;border-radius:6px;padding:8px 10px;display:none}
  /* 划词浮条 */
  .sel-para{font-size:15px;color:#333;line-height:2;background:#fff;padding:14px;border:1px solid var(--border);border-radius:6px;cursor:text}
  .sel-para::selection{background:#cfe3ff}
  .sel-bar{position:relative;display:inline-flex;gap:6px;background:#fff;border:1px solid var(--border);border-radius:8px;
    padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.14);margin:4px 0;z-index:7}
  .sel-bar .fp-btn{width:auto;display:inline-block;margin:0}
  .sel-result{margin-top:10px;font-size:13px;color:#333;background:#fff;border:1px solid var(--border);border-radius:6px;padding:10px 14px;display:none;line-height:1.6}

  /* 导航栏 demo */
  .nav-demo{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:9px 14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);flex-wrap:wrap}
  .nd-brand{font-weight:700;font-size:14px;margin-right:6px}
  .nd-item{font-size:13px;color:#555;cursor:pointer;padding:3px 6px;border-radius:4px}
  .nd-item:hover{background:#f1f1ef}
  .nd-ai{background:#111;color:#fff;border-radius:6px;padding:5px 10px;font-weight:500;cursor:pointer}
  .nd-ai:hover{background:#333}
  .nd-user{margin-left:auto;font-size:16px}
  .nd-page{background:#fff;border:1px solid var(--border);border-radius:6px;padding:16px;max-width:420px}
  .nd-page b{font-size:15px;display:block;margin-bottom:6px}
  .nd-page p{font-size:13.5px;color:#444}
  .nd-panel{position:relative;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:14px;max-width:240px;margin-top:12px;display:none}
  .nd-panel.show{display:block}
  .nd-panel b{font-size:14px;display:block;margin-bottom:6px}

  /* 工具栏 demo */
  .tb-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:7px 12px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .tb-bar b{font-size:13px;margin-right:auto}
  .tb-ic{font-size:13px;color:#444;padding:2px 8px;border-radius:4px;cursor:pointer}
  .tb-ic:hover{background:#f1f1ef}
  .tb-ai{background:#111;color:#fff;border-radius:6px;font-weight:500}
  .tb-ai:hover{background:#333}
  .tb-text{background:#fff;border:1px solid var(--border);border-radius:6px;padding:14px;font-size:14px;color:#333;line-height:1.8;max-width:460px}
  .tb-text b{background:#ffe9a8;padding:0 2px;border-radius:2px}
  .tb-menu{display:none;gap:6px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.14);max-width:240px;margin-top:8px}
  .tb-menu.show{display:block}
  .tb-menu .fp-btn{width:100%}

  /* 右键 demo */
  .ctx-list{background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px;max-width:300px}
  .ctx-file{font-size:14px;padding:7px 10px;border-radius:4px;cursor:default;color:#333}
  .ctx-file:hover{background:#f1f1ef}
  .ctx-file.on{background:#e7e7e3}
  .ctx-menu{position:absolute;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 8px 26px rgba(0,0,0,.18);min-width:190px;padding:5px;z-index:8;display:none}
  .ctx-menu.show{display:block}
  .cm-item{font-size:13px;padding:6px 10px;border-radius:4px;cursor:pointer}
  .cm-item:hover{background:#f1f1ef}
  .cm-item.ai{color:#0b6bcf}
  .cm-item.ai:hover{background:#eef4fb}
  .cm-sep{height:1px;background:#eee;margin:4px 6px}

  /* 就近触发 demo */
  .near-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;max-width:420px;cursor:pointer}
  .nc-head{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .nc-near{display:none;width:22px;height:22px;border-radius:6px;background:#111;color:#fff;place-items:center;font-size:12px;cursor:pointer}
  .nc-txt{font-size:13.5px;color:#444}
  .near-card:hover .nc-near{display:grid}
  .near-menu{display:none;background:#fff;border:1px solid var(--border);border-radius:8px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.14);max-width:230px;margin-top:8px}
  .near-menu.show{display:block}

  /* 命令面板 demo */
  .cmd-open{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 18px;font-size:14px;color:#333;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .cmd-open:hover{border-color:#aaa}
  .cmd-open kbd{background:#f1f1ef;border-radius:4px;padding:2px 6px;font-size:12px;font-family:var(--mono);margin-left:6px}
  .cmd-mask{position:absolute;inset:0;background:rgba(0,0,0,.25);display:none;z-index:8}
  .cmd-mask.show{display:block}
  .cmd-panel{position:relative;width:min(420px,90%);background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden;z-index:9;display:none;margin:0 auto}
  .cmd-panel.show{display:block}
  .cmd-input{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:12px 16px;font-size:14px}
  .cmd-input span{font-family:var(--mono);font-size:14px}
  .cmd-input input{border:none;outline:none;flex:1;font-size:14px;background:transparent;color:var(--text)}
  .cmd-list{padding:6px;max-height:220px;overflow-y:auto}
  .cmd-item2{font-size:13.5px;padding:8px 12px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
  .cmd-item2:hover,.cmd-item2.sel{background:#f1f1ef}
  .cmd-item2 .k{margin-left:auto;font-family:var(--mono);font-size:11px;color:#999}
  .cmd-foot{border-top:1px solid var(--border);padding:7px 16px;font-size:11px;color:#999}

  /* 空状态 demo */
  .empty-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:26px 24px;width:min(360px,92%);text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  .ec-eyebrow{font-size:12px;color:var(--muted);margin-bottom:8px}
  .ec-title{font-size:18px;font-weight:700;margin-bottom:6px}
  .ec-sub{font-size:13.5px;color:var(--muted);margin-bottom:16px}
  .ec-btn{display:block;width:100%;background:#f7f7f5;border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin:6px 0;font-size:13.5px;color:var(--text);cursor:pointer;text-align:left}
  .ec-btn:hover{background:#fff;border-color:#bbb}
  .ec-skip{margin-top:12px;font-size:12.5px;color:var(--blue);cursor:pointer;display:inline-block}
  .ec-done{font-size:12px;color:#0b6bcf;margin-top:8px;display:none}

  @media(max-width:820px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}.content.shifted{margin-left:0}}
</style>
</head>
<body>

<div class="topbar">
  <button class="menu" id="menuBtn" onclick="toggleSidebar()">☰</button>
  <div class="searchbox">🔍 <input id="searchInput" placeholder="搜索模式…" oninput="doSearch(this.value)"></div>
  <span class="crumb">AI 交互设计知识库 / <span id="crumbTail">入口设计</span></span>
</div>

<aside class="sidebar" id="sidebar">
  <div class="side-title"><span class="dot">AI</span> 交互设计知识库</div>
  <div id="sideTree"></div>
</aside>

<main class="content shifted" id="content">
  <div class="doc" id="doc"></div>
</main>

<script>
/* ============ 内容数据（A 模块） ============ */
const MODULE = {
  title:"A · AI 入口设计",
  lead:"入口设计决定用户在什么时刻、从哪里唤起 AI，以及系统会带入哪些任务上下文。好的入口不只要容易找到，更要贴近当前任务，并让用户清楚知道点击后会发生什么。",
  groups:[
    {label:"常驻入口",items:["导航栏按钮","悬浮球","工具栏图标"]},
    {label:"上下文入口",items:["划词唤起","右键菜单","就近触发"]},
    {label:"效率入口",items:["命令面板"]},
    {label:"新手入口",items:["空状态引导"]}
  ],
  patterns:[
    {id:"nav", emoji:"🧭", name:"导航栏按钮", cat:"常驻入口",
     desc:"把 AI 放在产品最稳定的位置，作为用户反复进入的一级功能入口。",
     use:"AI 是产品核心卖点、需要高曝光，或要在用户心智里确立「这是个 AI 产品」时。",
     diff:"可发现性最高、位置最稳定，但与正在处理的具体内容距离较远，占用稀缺的一级导航空间。",
     how:["文字标签 + 图标，别只放图标（可发现性）","有选中/激活态，与面板开合联动","位置稳定、跨页面一致"],
     trade:"导航位稀缺，放上去就要为它的点击率负责；AI 不够高频成熟时，占一级入口反而喧宾夺主。",
     refs:["Gmail Gemini","Slack","Linear"],
     avoid:"AI 仍是低频试验能力，或无法跨页面保持稳定体验时，不要过早占据一级导航资源。",
     states:["默认","悬停/聚焦","当前页","面板展开","新结果","不可用"],
     metrics:["导航点击率","任务发起率","重复访问率"],
     rel:"主任务入口 · 导航项 · 状态徽标 · 侧边面板",
     trigger:"始终位于稳定导航位置；进入后保留当前页面作为可选上下文。激活状态与页面/侧栏/面板开合同步。",
     platform:"桌面用顶栏或侧栏；移动端进主导航或底部一级入口，避免藏在多层汉堡菜单。",
     a11y:"用真实导航链接/按钮并标识当前状态；图标旁保留文字。名称表达价值，如「生成周报」而非「智能」。"},
    {id:"float", emoji:"🔵", name:"悬浮球", cat:"常驻入口",
     desc:"始终停留在界面边缘的全局入口，滚动或进入深层内容后仍可随时唤起。",
     use:"需要全局常驻、随时可唤起，又不想长期占用固定版面；尤其适合内容长、需持续滚动的编辑类产品。",
     diff:"比导航按钮更靠近当前内容，不随页面滚动消失；代价是持续占用视觉注意力，可能遮挡内容。",
     how:["可拖拽 + 自动吸边，不遮挡正文","红点/数字做未读或建议提醒","点击展开面板、再点收起，状态清晰","沉浸编辑时也保持可达"],
     trade:"移动端易误触，需收起态与安全边距；长期悬浮会和正文争夺注意力，默认低调、激活才强调。",
     refs:["微软 365 Copilot","Intercom","Crisp"],
     avoid:"有固定底部操作、局部任务多于全局任务，或悬浮按钮遮挡正文和关键控件时不应使用。",
     states:["默认","悬停/聚焦","新提醒","拖动中","面板展开","不可用"],
     metrics:["入口点击率","唤起后任务发起率","误触关闭率"],
     rel:"AI 唤起 · 继续任务 · 浮动按钮 · 徽标 · 侧边面板",
     trigger:"常驻显示；点击或键盘确认后展开。新结果徽标只表达状态，不擅自打开。默认携带当前页面/项目上下文并说明范围。",
     platform:"桌面可拖动吸边；移动端保持稳定位置，避开底部导航、键盘与安全区域，不把拖动作为必要操作。",
     a11y:"用有名称的按钮，支持 Enter/Space 与清晰焦点；提醒不只靠红点颜色；持续动画应允许减少。文案写「AI 助手」或具体任务。"},
    {id:"toolbar", emoji:"🛠️", name:"工具栏图标", cat:"常驻入口",
     desc:"把 AI 作为编辑能力的一部分，无需离开当前工作区即可改写、总结或生成。",

          <button class="ec-btn" data-empty="总结这篇文档的要点">📌 总结这篇文档的要点</button>
          <button class="ec-btn" data-empty="根据文档生成周报">📝 根据文档生成周报</button>
          <button class="ec-btn" data-empty="提取其中的风险和待办">⚠️ 提取其中的风险和待办</button>

      </div><div class="demo-note">空状态引导 · 首次教学入口 · 示例可点击 · 完成或跳过即退出</div></div>`
  };
  return demos[id]||'';
}

/* 高亮当前节 */
function spy(){
  const items=document.querySelectorAll('.side-item');
  items.forEach(i=>i.classList.remove('on'));
  let cur="#top";
  const links=[...items].map(a=>({id:a.getAttribute('href'),a})).filter(x=>x.id&&x.id!=="#top");
  const pos=window.scrollY+120;
  for(const x of links){const el=document.querySelector(x.id);if(el&&el.offsetTop<=pos)cur=x.id;}
  items.forEach(i=>i.classList.toggle('on',i.getAttribute('href')===cur));
}
window.addEventListener('scroll',spy);

/* ============ 交互 demo ============ */
function initDemos(){
  /* —— 悬浮球拖动 —— */
  const stage=document.getElementById("floatStage");
  if(stage){
    const ball=document.getElementById("floatball");
    const panel=document.getElementById("floatpanel");
    const note=document.getElementById("floatNote");
    let drag=false,offX=0,offY=0;
    // 点击切换面板
    ball.addEventListener("click",e=>{
      if(drag)return;
      panel.classList.toggle("show");
    });
    // 拖动
    ball.addEventListener("mousedown",e=>{
      drag=false;offX=e.clientX-ball.getBoundingClientRect().left;offY=e.clientY-ball.getBoundingClientRect().top;
      ball.classList.add("dragging");
      const move=ev=>{
        drag=true;ball.classList.add("dragging");
        const r=stage.getBoundingClientRect();
        let x=ev.clientX-offX-r.left,y=ev.clientY-offY-r.top;
        x=Math.max(0,Math.min(r.width-ball.offsetWidth,x));
        y=Math.max(0,Math.min(r.height-ball.offsetHeight,y));
        ball.style.left=x+"px";ball.style.right="auto";ball.style.top=y+"px";ball.style.bottom="auto";
        note.textContent="悬浮球拖动中…释放后自动吸边";
      };
      const up=()=>{
        ball.classList.remove("dragging");
        document.removeEventListener("mousemove",move);
        document.removeEventListener("mouseup",up);
        // 吸边
        const r=stage.getBoundingClientRect();
        const br=ball.getBoundingClientRect();
        const distL=br.left-r.left,distR=r.right-br.right;
        ball.style.transition="left .25s ease";
        if(distL<distR){ball.style.left="8px";}else{ball.style.left=(r.width-ball.offsetWidth-8)+"px";}
        ball.style.right="auto";
        setTimeout(()=>{ball.style.transition="";note.textContent="悬浮球可在区域内拖动 · 可自动吸边 · 点击展开 / 再点收起";},300);
      };
      document.addEventListener("mousemove",move);
      document.addEventListener("mouseup",up);
    });
    // 面板按钮
    panel.querySelectorAll(".fp-btn").forEach(b=>{
      b.addEventListener("click",()=>{
        let r=document.createElement("div");r.className="fp-result";
        r.style.display="block";
        r.textContent="✨ 已执行：「"+b.dataset.act+"」—— 在真实产品中，这会基于当前文档上下文调用 AI 完成该动作。";
        panel.appendChild(r);
      });
    });
    // 初始吸右
    ball.style.right="18px";ball.style.bottom="16px";
  }
  /* —— 划词唤起 —— */
  const para=document.getElementById("selPara");
  if(para){
    const bar=document.getElementById("selBar");
    const result=document.getElementById("selResult");
    const stage=document.getElementById("selStage");
    function positionBar(){
      const sel=window.getSelection();
      if(!sel.rangeCount||sel.isCollapsed){bar.hidden=true;return;}
      const range=sel.getRangeAt(0);
      if(!stage.contains(range.startContainer)&&!stage.contains(range.endContainer)){bar.hidden=true;return;}
      const rect=range.getBoundingClientRect();
      const stageRect=stage.getBoundingClientRect();
      bar.style.position="absolute";
      bar.style.left=Math.max(4,rect.left-stageRect.left)+"px";
      bar.style.top=Math.max(4,rect.top-stageRect.top-rect.height-44)+"px";
      bar.hidden=false;
    }
    document.addEventListener("mouseup",()=>{setTimeout(positionBar,30);});
    para.addEventListener("mouseup",e=>{e.stopPropagation();});
    document.addEventListener("mousedown",e=>{
      if(!bar.contains(e.target)){setTimeout(()=>{if(window.getSelection().isCollapsed)bar.hidden=true;},120);}
    });
    bar.querySelectorAll(".fp-btn").forEach(b=>{
      b.addEventListener("click",()=>{
        const sel=window.getSelection().toString().trim();
        result.style.display="block";
        const acts={改写:"AI 已对选中文字进行改写优化。",翻译:"AI 已将选中内容翻译。",总结:"AI 已对选中内容生成摘要。"};
        result.textContent="✨ 「"+b.dataset.sel+"」→ "+acts[b.dataset.sel]+(sel?"（选中的内容是：“"+sel.slice(0,40)+(sel.length>40?"…":"")+"”）":"");
        window.getSelection().removeAllRanges();
        bar.hidden=true;
      });
    });
  }
  /* —— 导航栏按钮 demo —— */
  const navStage=document.getElementById("navStage");
  if(navStage){
    const ai=document.getElementById("ndAi");
    const panel=document.getElementById("ndPanel");
    ai.addEventListener("click",()=>{panel.classList.toggle("show");});
    panel.querySelectorAll(".fp-btn").forEach(b=>{
      b.addEventListener("click",()=>{
        const r=document.getElementById("ndRes");
        r.style.display="block";
        r.textContent="✨ 已执行「"+b.dataset.nd+"」—— 在真实产品中，AI 助手会读取当前页面内容完成该动作。";
      });
    });
  }
  /* —— 工具栏 demo —— */
  const tbStage=document.getElementById("tbStage");
  if(tbStage){
    const text=document.getElementById("tbText");
    const menu=document.getElementById("tbMenu");
    const ai=document.getElementById("tbAi");
    let marked="";
    text.addEventListener("mouseup",()=>{
      const sel=window.getSelection().toString().trim();
      if(sel){marked=sel;menu.classList.add("show");}
      else{menu.classList.remove("show");}
    });
    document.addEventListener("mousedown",e=>{if(!menu.contains(e.target)&&e.target!==ai){menu.classList.remove("show");}});
    ai.addEventListener("click",()=>{if(marked){menu.classList.add("show");}else{const r=document.getElementById("tbRes");r.style.display="block";r.textContent="请先选中一段文字，再点击 ✦ AI。";}});
    menu.querySelectorAll(".fp-btn").forEach(b=>{
      b.addEventListener("click",()=>{
        const r=document.getElementById("tbRes");
        r.style.display="block";
        r.textContent="✨「"+b.dataset.tb+"」已应用到选中内容："+(marked?marked.slice(0,30)+(marked.length>30?"…":""):"");
        menu.classList.remove("show");window.getSelection().removeAllRanges();
      });
    });
  }
  /* —— 右键菜单 demo —— */
  const ctxStage=document.getElementById("ctxStage");
  if(ctxStage){
    const target=document.getElementById("ctxTarget");
    const menu=document.getElementById("ctxMenu");
    target.addEventListener("contextmenu",e=>{
      e.preventDefault();
      const sr=ctxStage.getBoundingClientRect();
      let x=e.clientX-sr.left,y=e.clientY-sr.top;
      menu.style.left=Math.min(x,sr.width-210)+"px";
      menu.style.top=Math.min(y,sr.height-menu.offsetHeight)+"px";
      menu.classList.add("show");
      target.classList.add("on");
    });
    document.addEventListener("click",e=>{if(!menu.contains(e.target)){menu.classList.remove("show");target.classList.remove("on");}});
    menu.querySelectorAll(".cm-item.ai").forEach(it=>{
      it.addEventListener("click",()=>{
        const r=document.getElementById("ctxRes");
        r.style.display="block";
        r.textContent="✨「"+it.dataset.ctx+"」已对「"+target.dataset.name+"」执行 —— 真实产品会读取该文件内容完成动作。";
        menu.classList.remove("show");target.classList.remove("on");
      });
    });
  }
  /* —— 就近触发 demo —— */
  const nearStage=document.getElementById("nearStage");
  if(nearStage){
    const card=document.getElementById("nearCard");
    const menu=document.getElementById("nearMenu");
    card.querySelector(".nc-near").addEventListener("click",()=>{
      menu.classList.toggle("show");
      // 菜单定位到卡片旁
      const cr=card.getBoundingClientRect(),sr=nearStage.getBoundingClientRect();
      menu.style.position="absolute";
      menu.style.left=(cr.left-sr.left+16)+"px";
      menu.style.top=(cr.top-sr.top+card.offsetHeight+4)+"px";
    });
    document.addEventListener("mousedown",e=>{if(!menu.contains(e.target)&&!card.contains(e.target))menu.classList.remove("show");});
    menu.querySelectorAll(".fp-btn").forEach(b=>{
      b.addEventListener("click",()=>{
        const r=document.getElementById("nearRes");
        r.style.display="block";r.style.marginTop="8px";
        r.textContent="✨「"+b.dataset.near+"」已对「数据看板」卡片执行 —— 只处理当前对象，不扩大读取范围。";
        menu.classList.remove("show");
      });
    });
  }
  /* —— 命令面板 demo —— */
  const cmdStage=document.getElementById("cmdStage");
  if(cmdStage){
    const panel=document.getElementById("cmdPanel");
    const mask=document.getElementById("cmdMask");
    const input=document.getElementById("cmdInput");
    const list=document.getElementById("cmdList");
    const foot=document.getElementById("cmdFoot");
    const res=document.getElementById("cmdRes");
    const cmds=[
      {t:"✦ AI 总结当前文档",g:"AI 指令"}, {t:"✦ 根据文档生成周报",g:"AI 指令"},
      {t:"✦ 提取风险与待办",g:"AI 指令"}, {t:"✦ AI 改写选中内容",g:"AI 指令"},
      {t:"跳转到「数据」",g:"导航"}, {t:"新建文档",g:"常用"}, {t:"导出 PDF",g:"常用"}
    ];
    function openCmd(){panel.classList.add("show");mask.classList.add("show");setTimeout(()=>input.focus(),50);renderCmds("");}
    function closeCmd(){panel.classList.remove("show");mask.classList.remove("show");}
    function renderCmds(q){
      const qq=q.trim().toLowerCase();
      const f=cmds.filter(c=>!qq||c.t.toLowerCase().includes(qq));
      list.innerHTML=f.map((c,i)=>`<div class="cmd-item2 ${i===0?"sel":""}" data-i="${i}"><span>${c.t}</span><span class="k">↵</span></div>`).join("")||'<div style="padding:10px;color:#999;font-size:13px">无结果</div>';
      list.querySelectorAll(".cmd-item2").forEach(el=>{
        el.addEventListener("mousemove",()=>{list.querySelectorAll(".cmd-item2").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");});
        el.addEventListener("click",()=>{runCmd(f[el.dataset.i].t);});
      });
    }
    function runCmd(t){
      res.style.display="block";res.textContent="✨ 已执行：「"+t+"」";
      closeCmd();
    }
    document.getElementById("cmdOpen").addEventListener("click",openCmd);
    mask.addEventListener("click",closeCmd);
    input.addEventListener("input",e=>renderCmds(input.value));
    input.addEventListener("keydown",e=>{
      const items=[...list.querySelectorAll(".cmd-item2")];
      if(e.key==="ArrowDown"){e.preventDefault();const ci=items.findIndex(x=>x.classList.contains("sel"));if(ci>-1&&ci<items.length-1){items[ci].classList.remove("sel");items[ci+1].classList.add("sel");}}
      else if(e.key==="ArrowUp"){e.preventDefault();const ci=items.findIndex(x=>x.classList.contains("sel"));if(ci>0){items[ci].classList.remove("sel");items[ci-1].classList.add("sel");}}
      else if(e.key==="Enter"){const ci=items.findIndex(x=>x.classList.contains("sel"));if(ci>-1)runCmd(cmds.filter(c=>c.t.toLowerCase().includes(input.value.trim().toLowerCase()))[ci]?.t);}
      else if(e.key==="Escape"){closeCmd();}
    });
    document.addEventListener("keydown",e=>{
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();panel.classList.contains("show")?closeCmd():openCmd();}
    });
    // 预渲染隐藏面板内容,以便回车逻辑
    renderCmds("");
    panel.classList.remove("show");
  }
  /* —— 空状态 demo —— */
  const emptyStage=document.getElementById("emptyStage");
  if(emptyStage){
    const card=document.getElementById("emptyCard");
    card.querySelectorAll(".ec-btn").forEach(b=>{
      b.addEventListener("click",()=>{
        const r=document.getElementById("ecRes");
        r.style.display="block";
        r.textContent="✨ 正在执行：「"+b.dataset.empty+"」—— 完成后此引导可收起，进入主流程。";
      });
    });
    document.getElementById("ecSkip").addEventListener("click",()=>{
      card.innerHTML='<div style="padding:20px 0;color:#999;font-size:13.5px">已跳过引导，直接进入主界面 ✕</div>';
    });
  }
}

  q=q.trim().toLowerCase();
  if(!q){/* 暂不实现隐藏逻辑，完整版接入 */return;}
}
function toggleSidebar(){
  const sb=document.getElementById("sidebar");
  sb.classList.toggle('closed');sb.classList.toggle('open');
  document.getElementById("content").classList.toggle('shifted');
}
